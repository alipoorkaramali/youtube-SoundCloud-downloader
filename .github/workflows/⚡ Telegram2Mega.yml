name: 🌀 Scrape Telegram & Save to Mega

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'نام کاربری کانال (پیش‌فرض = آخرین کانال دانلودشده؛ وضعیت هر کانال جدا در State ذخیره می‌شود)'
        required: true
        default: 'speaking_practice1404'
      channel_name:
        description: 'نام نمایشی کانال (اختیاری، برای جستجوی دقیق‌تر)'
        required: false
        default: ''
      start_link:
        description: 'لینک مستقیم به یک پست (اختیاری، مثال: https://t.me/example/123)'
        required: false
        default: ''
      scroll_direction:
        description: '🧭 جهت اسکرول: up = پست‌های قدیمی‌تر (بالا)، down = پست‌های جدیدتر (پایین)'
        required: false
        default: 'up'
        type: choice
        options:
          - 'up'
          - 'down'
      limit:
        description: 'تعداد پست‌ها'
        required: false
        default: '35'
      max_media_mb:
        description: 'حداکثر حجم رسانه (MB)'
        required: false
        default: '80'
      debug_mode:
        description: 'حالت دیباگ (اسکرین‌شات از هر مرحله)'
        type: boolean
        required: false
        default: false
      save_screenshots:
        description: 'ذخیره اسکرین‌شات‌ها (غیرفعال کردن آن سرعت را تا ۳۰٪ افزایش می‌دهد و حجم خروجی را بسیار کاهش می‌دهد)'
        type: boolean
        required: false
        default: false
      resume:
        description: 'ادامه از آخرین پست (اگر فعال باشد، start_link نادیده گرفته می‌شود)'
        type: boolean
        required: false
        default: false
      mega_folder:
        description: '📂 پوشه مقصد در Mega.nz'
        required: true
        default: 'TelegramArchive'
      download_quiet_timeout:
        description: '⏳ آستانه سکوت برای اتمام دانلود (ثانیه)'
        required: false
        default: '20'
      retry_failed:
        description: '🔄 تلاش مجدد برای پست‌های ناموفق (فعال کردن این گزینه، سایر ورودی‌ها را نادیده می‌گیرد. فقط نام کانال کافی است)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.channel }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
          fetch-depth: 1

      - name: 📂 Load persistent channel state
        id: channel_state
        run: |
          STATE_FILE="State/telegram_channels_state.json"
          CHANNEL="${{ github.event.inputs.channel }}"
          CHANNEL=$(echo "$CHANNEL" | sed 's/^@//')

          if [ ! -f "$STATE_FILE" ]; then
            echo "ℹ️ فایل وضعیت وجود ندارد — با ساختار خالی ساخته می‌شود"
            mkdir -p State
            echo '{"last_used_channel":"","channel_list":[],"channels":{}}' > "$STATE_FILE"
          fi

          echo "════════════════════════════════════════"
          echo "📋 نقشه وضعیت کانال‌ها (پشتیبانی چندکاناله)"
          echo "════════════════════════════════════════"
          cat "$STATE_FILE" | jq '.' || cat "$STATE_FILE"
          echo "────────────────────────────────────────"
          echo "📌 لیست کانال‌های ذخیره‌شده:"
          jq -r '
            ((.channel_list // []) + (.channels | keys) | unique)[] as $ch |
            (.channels[$ch] // {}) as $info |
            "  • @\($ch)  | last_post=\($info.last_post_id // "-")  | updated=\($info.last_updated // "-")  | count=\($info.downloaded_posts_count // 0)"
          ' "$STATE_FILE" 2>/dev/null || true
          echo "════════════════════════════════════════"

          LAST_POST=$(jq -r --arg ch "$CHANNEL" '.channels[$ch].last_post_id // empty' "$STATE_FILE")
          LAST_USED=$(jq -r '.last_used_channel // empty' "$STATE_FILE")

          echo "LAST_POST_ID=$LAST_POST" >> $GITHUB_OUTPUT
          echo "LAST_USED_CHANNEL=$LAST_USED" >> $GITHUB_OUTPUT

          if [ -n "$LAST_POST" ] && [ "$LAST_POST" != "null" ]; then
            echo "✅ آخرین پست ذخیره‌شده برای @$CHANNEL → $LAST_POST"
            echo "HAS_SAVED_POST=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ هیچ پست قبلی برای @$CHANNEL ذخیره نشده (اولین اجرا برای این کانال)"
            echo "HAS_SAVED_POST=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$LAST_USED" ] && [ "$LAST_USED" != "null" ]; then
            echo "📌 آخرین کانال دانلودشده (پیش‌فرض UI): @$LAST_USED"
          fi

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 💾 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y jq unzip xvfb

      - name: 💾 Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 🎭 Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: 🔓 Decrypt browser profile
        run: |
          if [ ! -f config/browser_profile.tar.gz.gpg ]; then
            echo "❌ فایل config/browser_profile.tar.gz.gpg یافت نشد!"
            exit 1
          fi
          gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" \
              --decrypt config/browser_profile.tar.gz.gpg > config/browser_profile.tar.gz
          if [ ! -s config/browser_profile.tar.gz ]; then
            echo "❌ رمزگشایی پروفایل ناموفق بود یا فایل خالی است"
            exit 1
          fi
          echo "✅ پروفایل با موفقیت رمزگشایی شد"

      - name: 📂 Extract browser profile
        run: tar -xzf config/browser_profile.tar.gz -C config/

      - name: ⚙️ Update config.yaml with inputs
        run: |
          pip install pyyaml
          python -c "
          import yaml, os
          with open('config/config.yaml', 'r') as f:
              c = yaml.safe_load(f)
          c['channel'] = '${{ github.event.inputs.channel }}' or 'unknown'
          c['channel_name'] = '${{ github.event.inputs.channel_name }}'
          start_link = '${{ github.event.inputs.start_link }}'.strip()
          saved_post = '${{ steps.channel_state.outputs.LAST_POST_ID }}'.strip()
          channel = c['channel'].lstrip('@')
          if not start_link and saved_post and saved_post not in ('', 'null'):
              start_link = f'https://t.me/{channel}/{saved_post}'
              print(f'🔄 start_link از وضعیت دائمی تنظیم شد: {start_link}')
              user_scroll = '${{ github.event.inputs.scroll_direction }}' or 'up'
              if user_scroll == 'up' and '${{ github.event.inputs.resume }}'.lower() != 'true':
                  c['scroll_direction'] = 'down'
                  print('🧭 جهت اسکرول خودکار روی down (پست‌های جدیدتر) تنظیم شد')
              else:
                  c['scroll_direction'] = user_scroll
          else:
              c['scroll_direction'] = '${{ github.event.inputs.scroll_direction }}' or 'up'
          c['start_link'] = start_link
          c['limit'] = ${{ github.event.inputs.limit }}
          c['max_media_mb'] = ${{ github.event.inputs.max_media_mb }}
          download_quiet = int('${{ github.event.inputs.download_quiet_timeout }}')
          limit = int('${{ github.event.inputs.limit }}')
          c['timeout_seconds'] = (download_quiet + 4) * limit + 2800
          c['download_quiet_seconds'] = download_quiet
          c['mega_folder'] = '${{ github.event.inputs.mega_folder }}'
          c['save_screenshots'] = '${{ github.event.inputs.save_screenshots }}'.lower() == 'true'
          c['resume'] = '${{ github.event.inputs.resume }}'.lower() == 'true' or bool(saved_post and saved_post not in ('', 'null') and not '${{ github.event.inputs.start_link }}'.strip())
          c['retry_failed'] = '${{ github.event.inputs.retry_failed }}'.lower() == 'true'
          if not c.get('start_link'):
              c.pop('start_link', None)
          with open('config/config.yaml', 'w') as f:
              yaml.dump(c, f, default_flow_style=False, allow_unicode=True)
          print('✅ config.yaml به‌روز شد')
          "

      - name: 🧮 Calculate timeout from inputs
        id: calc_timeout
        run: |
          DOWNLOAD_QUIET=${{ github.event.inputs.download_quiet_timeout }}
          LIMIT=${{ github.event.inputs.limit }}
          TIMEOUT_SECONDS=$((DOWNLOAD_QUIET * LIMIT + 1800))
          TIMEOUT_MINUTES=$((TIMEOUT_SECONDS / 60))
          echo "TIMEOUT_SECONDS=$TIMEOUT_SECONDS" >> $GITHUB_ENV
          echo "TIMEOUT_MINUTES=$TIMEOUT_MINUTES" >> $GITHUB_ENV
          echo "⏱️ زمان محاسبه‌شده: ${TIMEOUT_SECONDS} ثانیه (${TIMEOUT_MINUTES} دقیقه)"

      - name: 📥 Download previous resume state (if resume is enabled)
        if: ${{ github.event.inputs.resume == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT_DIR="Download/telegram_downloads/${{ github.event.inputs.channel }}"
          mkdir -p "$OUTPUT_DIR"
          ARTIFACT_NAME="resume-state-${{ github.event.inputs.channel }}"
          echo "🔍 جستجوی آرتیفکت با نام: $ARTIFACT_NAME"
          ARTIFACT_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME&per_page=5" \
            | jq -r '.artifacts | sort_by(.created_at) | reverse | .[0].id')
          if [ "$ARTIFACT_ID" != "null" ] && [ -n "$ARTIFACT_ID" ]; then
            echo "✅ آرتیفکت وضعیت قبلی پیدا شد (ID: $ARTIFACT_ID)"
            curl -L -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
              -o /tmp/resume_state.zip
            unzip -j /tmp/resume_state.zip -d "$OUTPUT_DIR"
            if [ -f "$OUTPUT_DIR/resume_state.json" ]; then
              echo "✅ فایل resume_state.json با موفقیت بازیابی شد"
              cat "$OUTPUT_DIR/resume_state.json" | jq '.'
            else
              echo "⚠️ فایل در زیپ پیدا نشد"
            fi
          else
            echo "ℹ️ هیچ وضعیت قبلی یافت نشد، اسکریپت از ابتدا شروع می‌کند."
          fi

      - name: 🧹 Clean old media (keep resume_state.json)
        run: |
          OUTPUT_DIR="Download/telegram_downloads/${{ github.event.inputs.channel }}"
          if [ -d "$OUTPUT_DIR" ] && [ "$OUTPUT_DIR" != "/" ] && [ "$OUTPUT_DIR" != "." ] && [ "$OUTPUT_DIR" != "Download" ]; then
            echo "🧹 پاکسازی پوشه: $OUTPUT_DIR (به جز resume_state.json)"
            find "$OUTPUT_DIR" -mindepth 1 -not -name "resume_state.json" -exec rm -rf {} +
            echo "✅ پاکسازی انجام شد."
          else
            echo "ℹ️ پوشه خالی یا نامعتبر است، پاکسازی انجام نشد."
          fi

      - name: 📥 Download previous download report (for resume)
        if: ${{ github.event.inputs.resume == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT_DIR="Download/telegram_downloads/${{ github.event.inputs.channel }}"
          mkdir -p "$OUTPUT_DIR"
          ARTIFACT_NAME="download-report-${{ github.event.inputs.channel }}"
          ARTIFACT_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME&per_page=5" \
            | jq -r '.artifacts | sort_by(.created_at) | reverse | .[0].id')
          if [ "$ARTIFACT_ID" != "null" ] && [ -n "$ARTIFACT_ID" ]; then
            echo "✅ آرتیفکت گزارش قبلی پیدا شد (ID: $ARTIFACT_ID)"
            curl -L -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
              -o /tmp/report.zip
            unzip -j /tmp/report.zip -d "$OUTPUT_DIR"
            if [ -f "$OUTPUT_DIR/download_report.txt" ]; then
              echo "✅ گزارش قبلی با موفقیت بازیابی شد"
              head -10 "$OUTPUT_DIR/download_report.txt"
            fi
          else
            echo "ℹ️ هیچ گزارش قبلی در آرتیفکت یافت نشد"
          fi

      - name: 📦 Install rclone (official with mega support)
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: 🔓 Decrypt rclone config
        run: |
          mkdir -p ~/.config/rclone
          if [ ! -f config/rclone_mega.conf.gpg ]; then
            echo "❌ فایل config/rclone_mega.conf.gpg پیدا نشد!"
            exit 1
          fi
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" \
              --output ~/.config/rclone/rclone.conf config/rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf
          echo "✅ rclone config loaded"
          rclone listremotes

      - name: 🔍 Debug all artifacts
        if: ${{ github.event.inputs.retry_failed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            | jq '.artifacts[] | {id: .id, name: .name, created_at: .created_at, expired: .expired}'

      - name: 📥 Download previous report for retry
        if: ${{ github.event.inputs.retry_failed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT_DIR="Download/telegram_downloads/${{ github.event.inputs.channel }}/"
          mkdir -p "$OUTPUT_DIR"
          NAMES_TO_TRY=("download-report-${{ github.event.inputs.channel }}" "download-report")
          ARTIFACT_ID=""
          for ARTIFACT_NAME in "${NAMES_TO_TRY[@]}"; do
            FOUND_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              | jq -r --arg name "$ARTIFACT_NAME" \
                '.artifacts | map(select(.name == $name and .expired == false)) | sort_by(.created_at) | reverse | .[0].id')
            if [ "$FOUND_ID" != "null" ] && [ -n "$FOUND_ID" ]; then
              ARTIFACT_ID="$FOUND_ID"
              break
            fi
          done
          if [ -z "$ARTIFACT_ID" ]; then
            echo "⚠️ هیچ آرتیفکتی یافت نشد!"
            exit 0
          fi
          curl -L -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/artifact.zip
          unzip -j /tmp/artifact.zip "download_report.txt" -d "$OUTPUT_DIR" || unzip -j /tmp/artifact.zip -d "$OUTPUT_DIR"
          if [ -f "$OUTPUT_DIR/download_report.txt" ]; then
            echo "✅ گزارش دانلود شد"
          else
            echo "❌ فایل گزارش پیدا نشد!"
            exit 1
          fi

      - name: 🚀 Run Telegram Scraper
        if: ${{ !inputs.debug_mode }}
        run: xvfb-run python .github/scripts/main.py --config config/config.yaml
        timeout-minutes: 360

      - name: 🐞 Run Debug Scraper
        if: ${{ inputs.debug_mode }}
        run: xvfb-run python .github/scripts/debug_scraper.py
        timeout-minutes: 360

      - name: 🧹 Clean old artifacts (delete all previous versions)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ARTIFACT_NAME in "download-report-${{ github.event.inputs.channel }}" "resume-state-${{ github.event.inputs.channel }}"; do
            ARTIFACTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME&per_page=100")
            ALL_IDS=$(echo "$ARTIFACTS" | jq -r '.artifacts[].id')
            if [ -n "$ALL_IDS" ]; then
              for id in $ALL_IDS; do
                curl -X DELETE -H "Authorization: token $GH_TOKEN" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id" -s -o /dev/null
              done
            fi
          done

      - name: 📤 Upload download report as artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: download-report-${{ github.event.inputs.channel }}
          path: Download/telegram_downloads/${{ github.event.inputs.channel }}/download_report.txt
          overwrite: true

      - name: ☁️ Upload download report to Mega
        if: ${{ !inputs.debug_mode }}
        run: |
          REPORT_PATH="Download/telegram_downloads/${{ github.event.inputs.channel }}/download_report.txt"
          if [ -f "$REPORT_PATH" ]; then
            rclone copy "$REPORT_PATH" \
                       "mega:${{ github.event.inputs.mega_folder }}/${{ github.event.inputs.channel }}/" \
                       --progress -vv
          fi

      - name: 📸 Commit debug screenshot (TEMPORARY)
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Download/telegram_downloads/${{ github.event.inputs.channel }}/debug_screenshots/*.png" || true
          git commit -m "📸 Temporary debug screenshot [REMOVE LATER]" || true
          git push || true

      - name: 📊 Verify output
        if: ${{ always() }}
        run: |
          OUTPUT_DIR="Download/telegram_downloads/${{ github.event.inputs.channel }}"
          if [ ! -d "$OUTPUT_DIR" ] || [ -z "$(ls -A $OUTPUT_DIR)" ]; then
            if [[ "${{ inputs.debug_mode }}" == "false" ]]; then
              echo "❌ No output found"
              exit 1
            fi
          else
            echo "✅ Output directory is ready"
          fi

      - name: 📤 Upload resume state as artifact (for next run)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: resume-state-${{ github.event.inputs.channel }}
          path: Download/telegram_downloads/${{ github.event.inputs.channel }}/resume_state.json
          overwrite: true
          retention-days: 7

      - name: 💾 Update persistent channel state & commit
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"
          CHANNEL=$(echo "$CHANNEL" | sed 's/^@//')
          CHANNEL_NAME="${{ github.event.inputs.channel_name }}"
          LIMIT_VAL="${{ github.event.inputs.limit }}"
          MEGA_FOLDER="${{ github.event.inputs.mega_folder }}"
          STATE_FILE="State/telegram_channels_state.json"
          RESUME_FILE="Download/telegram_downloads/${CHANNEL}/resume_state.json"
          WORKFLOW_FILE=".github/workflows/⚡ Telegram2Mega.yml"

          mkdir -p State
          if [ ! -f "$STATE_FILE" ]; then
            echo '{"last_used_channel":"","channel_list":[],"channels":{}}' > "$STATE_FILE"
          fi

          LAST_POST=""
          DOWNLOADED_COUNT=0
          RECENT_IDS="[]"
          if [ -f "$RESUME_FILE" ]; then
            LAST_POST=$(jq -r '.last_post_id // empty' "$RESUME_FILE")
            DOWNLOADED_COUNT=$(jq -r '(.downloaded_posts // []) | length' "$RESUME_FILE")
            RECENT_IDS=$(jq -c '(.downloaded_posts // []) | .[-20:]' "$RESUME_FILE")
            echo "📄 last_post_id: $LAST_POST (count: $DOWNLOADED_COUNT)"
          else
            echo "⚠️ resume_state.json پیدا نشد"
          fi

          if [ -n "$LAST_POST" ] && [ "$LAST_POST" != "null" ]; then
            NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            jq --arg ch "$CHANNEL" \
               --arg post "$LAST_POST" \
               --arg name "$CHANNEL_NAME" \
               --arg now "$NOW" \
               --arg limit "$LIMIT_VAL" \
               --arg mega "$MEGA_FOLDER" \
               --argjson count "$DOWNLOADED_COUNT" \
               --argjson recent "$RECENT_IDS" \
               '
               .last_used_channel = $ch |
               .channel_list = ((.channel_list // []) + [$ch] | unique) |
               .channels[$ch] = ((.channels[$ch] // {}) + {
                 last_post_id: $post,
                 last_updated: $now,
                 channel_name: (if $name != "" then $name else ((.channels[$ch].channel_name) // "") end),
                 last_limit: ($limit | tonumber? // $limit),
                 last_mega_folder: $mega,
                 downloaded_posts_count: $count,
                 recent_post_ids: $recent
               })
               ' "$STATE_FILE" > /tmp/channels_state_new.json
            mv /tmp/channels_state_new.json "$STATE_FILE"
            echo "✅ وضعیت چندکاناله به‌روز شد:"
            cat "$STATE_FILE" | jq '.'

            if [ -f "$WORKFLOW_FILE" ]; then
              export UPDATE_CHANNEL_DEFAULT="$CHANNEL"
              python3 -c '
          import os
          from pathlib import Path
          channel = os.environ["UPDATE_CHANNEL_DEFAULT"]
          wf = Path(".github/workflows/⚡ Telegram2Mega.yml")
          content = wf.read_text(encoding="utf-8")
          lines = content.splitlines(keepends=True)
          out = []
          seen_channel = False
          replaced = False
          for line in lines:
              stripped = line.strip()
              if (not replaced) and stripped.startswith("channel:") and "channel_name" not in stripped:
                  seen_channel = True
                  out.append(line)
                  continue
              if seen_channel and (not replaced) and stripped.startswith("default:"):
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(f"{indent}default: \'{channel}\'\n")
                  replaced = True
                  seen_channel = False
                  continue
              if seen_channel and stripped.startswith("channel_name:"):
                  seen_channel = False
              out.append(line)
          if replaced:
              wf.write_text("".join(out), encoding="utf-8")
              print(f"✅ default کانال در ورک‌فلو → {channel}")
          else:
              print("⚠️ نتوانست default را به‌روز کند")
          '
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$STATE_FILE"
            [ -f "$WORKFLOW_FILE" ] && git add "$WORKFLOW_FILE" || true
            if git diff --cached --quiet; then
              echo "ℹ️ تغییری نیست"
            else
              git commit -m "chore(telegram): update state for @${CHANNEL} → post ${LAST_POST} (multi-channel map)"
              git push origin "HEAD:${{ github.ref_name }}"
              echo "✅ پوش شد به ${{ github.ref_name }}"
            fi
          else
            echo "ℹ️ last_post_id خالی — commit نشد"
          fi

      - name: ☁️ Upload media to Mega (normal mode)
        if: ${{ !inputs.debug_mode }}
        run: |
          rclone copy "Download/telegram_downloads/${{ github.event.inputs.channel }}/media" \
                     "mega:${{ github.event.inputs.mega_folder }}/${{ github.event.inputs.channel }}" \
                     --progress --transfers=4 -vv

      - name: ☁️ Upload ALL debug outputs to Mega
        if: ${{ inputs.debug_mode }}
        run: |
          rclone copy "Download/telegram_downloads/${{ github.event.inputs.channel }}" \
                     "mega:${{ github.event.inputs.mega_folder }}/${{ github.event.inputs.channel }}-debug" \
                     --progress --transfers=4 -vv
