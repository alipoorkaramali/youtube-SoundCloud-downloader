name: 🔐Check and Trigger Downloads (from news log)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (if any)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run check_and_trigger script
        run: python .github/scripts/check_and_trigger.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes (processed.txt and mega_upload_log.txt)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add State/processed.txt
          git add State/mega_upload_log.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update processed hashes and mega upload log"
            git push
          fi
