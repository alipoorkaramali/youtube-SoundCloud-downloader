name: 🎬🎵 Auto Downloader + Mega.nz (YouTube/SoundCloud - Audio/Video - ZIP split)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '🌐 پلتفرم'
        required: true
        default: 'youtube'
        type: choice
        options:
          - youtube
          - soundcloud
      url:
        description: '🔗 لینک ویدئو / آهنگ'
        required: true
      type:
        description: 'نوع دانلود'
        required: true
        default: 'audio'
        type: choice
        options:
          - audio
          - video
      quality:
        description: '🎬 کیفیت ویدیو (فقط در حالت ویدیو)'
        required: false
        default: 'best'
        type: choice
        options:
          - '144p'
          - '240p'
          - '360p'
          - '480p'
          - '720p'
          - '1080p'
          - 'best'
      folder:
        description: '📁 پوشه موقت'
        required: false
        default: 'downloads'
      mega_folder:
        description: '📂 پوشه در Mega.nz'
        required: false
        default: 'YoutubeDownloads'
      split_choice:
        description: 'تقسیم فایل به چند قسمت (ZIP volume)؟'
        required: true
        default: 'single'
        type: choice
        options:
          - single
          - split
      split_size:
        description: 'اندازه هر قسمت (مثال: 100M, 500M, 1G)'
        required: false
        default: '100M'

jobs:
  download:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 دریافت فایل‌های مخزن
        uses: actions/checkout@v4

      - name: 🔐 رمزگشایی فایل cookies.txt.gpg
        run: |
          if [ ! -f "cookies.txt.gpg" ]; then
            echo "❌ خطا: فایل cookies.txt.gpg در مخزن یافت نشد!"
            exit 1
          fi
          gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" --decrypt cookies.txt.gpg > cookies.txt
          if [ -s cookies.txt ]; then
            echo "✅ فایل cookies.txt با موفقیت رمزگشایی شد."
          else
            echo "❌ خطا: رمزگشایی ناموفق بود یا فایل کوکی خالی است."
            exit 1
          fi

      - name: ⚙️ نصب yt-dlp و ffmpeg
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          ejs-node: true
          aria2: true
          ffmpeg: true

      - name: 💾 Cache rclone binary (user path)
        id: cache-rclone
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/rclone
          key: ${{ runner.os }}-rclone-v1.74.0

      - name: 📦 Install rclone if not cached
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.local/bin
          cp /usr/bin/rclone ~/.local/bin/

      - name: 🔗 Copy rclone to system PATH
        run: |
          if [ ! -f /usr/bin/rclone ]; then
            sudo cp ~/.local/bin/rclone /usr/bin/rclone
            sudo chmod +x /usr/bin/rclone
          fi
          rclone version

      - name: 🔓 Decrypt rclone config
        run: |
          mkdir -p ~/.config/rclone
          gpg --quiet --batch --yes \
            --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" \
            --output ~/.config/rclone/rclone.conf rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf
          rclone --config ~/.config/rclone/rclone.conf listremotes

      - name: 🧹 پاکسازی پوشه قبلی
        run: rm -rf "${{ github.event.inputs.folder }}" 2>/dev/null || true

      # ================= YOUTUBE (PRO VERSION) =================
      - name: ▶️ یوتیوب | دانلود (Ultra Smart Anti-Bot)
        if: github.event.inputs.platform == 'youtube'
        run: |
          mkdir -p "${{ github.event.inputs.folder }}"
          cd "${{ github.event.inputs.folder }}"

          URL="${{ github.event.inputs.url }}"

          BASE_ARGS="\
            --cookies ../cookies.txt \
            --force-ipv4 \
            --no-playlist \
            --force-overwrites \
            --retries 5 \
            --fragment-retries 5 \
            --retry-sleep 5 \
            --sleep-interval 8 \
            --max-sleep-interval 25 \
            --sleep-requests 2 \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.6367.91 Safari/537.36' \
          "

          if [ "${{ github.event.inputs.type }}" = "video" ]; then
            QUALITY="${{ github.event.inputs.quality }}"
            if [ "$QUALITY" = "best" ]; then
              FORMAT="bestvideo+bestaudio/best"
            else
              HEIGHT="${QUALITY%p}"
              FORMAT="bestvideo[height<=$HEIGHT]+bestaudio/best"
            fi
            EXTRA="--merge-output-format mp4"
          else
            FORMAT="bestaudio[ext=m4a]/bestaudio/best"
            EXTRA="-x --audio-format mp3 --audio-quality 0"
          fi

          try_dl () {
            CLIENT=$1
            SKIP=$2
            echo "🚀 client=$CLIENT skip=$SKIP"
            yt-dlp -f "$FORMAT" \
              $EXTRA \
              $BASE_ARGS \
              --extractor-args "youtube:player_client=$CLIENT" \
              --extractor-args "youtube:skip=$SKIP" \
              "$URL" \
              -o "%(title)s.%(ext)s"
          }

          SUCCESS=0

          try_dl android webpage && SUCCESS=1
          [ $SUCCESS -eq 0 ] && try_dl android "" && SUCCESS=1
          [ $SUCCESS -eq 0 ] && try_dl web webpage && SUCCESS=1
          [ $SUCCESS -eq 0 ] && try_dl web "" && SUCCESS=1
          [ $SUCCESS -eq 0 ] && try_dl ios "" && SUCCESS=1

          if [ $SUCCESS -eq 0 ]; then
            echo "❌ دانلود شکست خورد"
            exit 1
          fi

          FILE=$(ls | head -1)
          echo "DOWNLOADED_FILE=$FILE" >> $GITHUB_ENV
          TITLE=$(basename "$FILE" | sed 's/\.[^.]*$//')
          echo "VIDEO_TITLE=$TITLE" >> $GITHUB_ENV

      # ================= SOUNDCLOUD =================
      - name: ☁️ ساندکلاد | دانلود
        if: github.event.inputs.platform == 'soundcloud'
        run: |
          mkdir -p "${{ github.event.inputs.folder }}"
          cd "${{ github.event.inputs.folder }}"

          yt-dlp -x --audio-format mp3 --audio-quality 0 \
            --no-playlist \
            --force-ipv4 \
            --sleep-interval 5 \
            --max-sleep-interval 15 \
            "${{ github.event.inputs.url }}" \
            -o "%(title)s.%(ext)s"

          FILE=$(ls | head -1)
          echo "DOWNLOADED_FILE=$FILE" >> $GITHUB_ENV
          TITLE=$(basename "$FILE" | sed 's/\.[^.]*$//')
          echo "VIDEO_TITLE=$TITLE" >> $GITHUB_ENV

      # ================= SPLIT =================
      - name: ✂️ تقسیم فایل
        if: github.event.inputs.split_choice == 'split'
        run: |
          cd "${{ github.event.inputs.folder }}"
          FILE="${{ env.DOWNLOADED_FILE }}"
          SIZE="${{ github.event.inputs.split_size }}"
          sudo apt-get install -y zip
          zip -s "$SIZE" "${FILE}.zip" "$FILE"
          rm "$FILE"

      # ================= MEGA =================
      - name: ☁️ آپلود به Mega.nz
        run: |
          CONFIG="$HOME/.config/rclone/rclone.conf"
          DEST="mega:${{ github.event.inputs.mega_folder }}"
          rclone --config "$CONFIG" mkdir "$DEST" || true
          rclone --config "$CONFIG" copy "${{ github.event.inputs.folder }}" "$DEST" \
            --progress --transfers=4

      # ================= NOTIFICATION =================
      - name: 📱 اعلان
        if: success()
        run: |
          if [ -z "${{ secrets.PB_TOKEN }}" ]; then exit 0; fi
          curl -u "${{ secrets.PB_TOKEN }}": \
            -X POST https://api.pushbullet.com/v2/pushes \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"note\",\"title\":\"✅ دانلود انجام شد\",\"body\":\"${{ env.VIDEO_TITLE }}\"}"
