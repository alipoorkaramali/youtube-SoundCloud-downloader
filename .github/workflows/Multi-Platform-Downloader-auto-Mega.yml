name: 🎬🎵 Auto Downloader + Mega.nz

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '🌐 پلتفرم'
        required: true
        default: 'youtube'
        type: choice
        options:
          - youtube
          - soundcloud
      url:
        description: '🔗 لینک دانلود'
        required: true
      type:
        description: 'نوع محتوا (audio/video)'
        required: false
        default: 'audio'
        type: string
      quality:
        description: 'کیفیت دانلود (best, worst, etc.)'
        required: false
        default: 'best'
        type: string
      folder:
        description: '📁 پوشه در مخزن (موقت)'
        required: false
        default: 'news_downloads'
      mega_folder:
        description: '📂 پوشه در Mega.nz'
        required: false
        default: 'YoutubeNews'
      split_choice:
        description: 'تقسیم فایل به چند قسمت (ZIP volume)؟'
        required: true
        default: 'single'
        type: choice
        options:
          - single
          - split
      split_size:
        description: 'اندازه هر قسمت (مثال: 100M, 500M, 1G)'
        required: false
        default: '100M'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Decrypt cookies
        run: |
          if [ ! -f config/cookies.txt.gpg ]; then
            echo "❌ فایل config/cookies.txt.gpg یافت نشد!"
            exit 1
          fi
          gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" --decrypt config/cookies.txt.gpg > cookies.txt
          if [ ! -s cookies.txt ]; then
            echo "❌ رمزگشایی کوکی ناموفق بود یا فایل خالی است"
            exit 1
          fi
          echo "✅ کوکی با موفقیت رمزگشایی شد"

      - name: ⚙️ Setup yt-dlp + ffmpeg
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          aria2: true
          ffmpeg: true

      - name: 📦 Install rclone (official with mega support)
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: 🔓 Decrypt rclone config
        run: |
          mkdir -p ~/.config/rclone
          if [ ! -f config/rclone_mega.conf.gpg ]; then
            echo "❌ فایل config/rclone_mega.conf.gpg پیدا نشد!"
            exit 1
          fi
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" \
              --output ~/.config/rclone/rclone.conf config/rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf
          echo "✅ rclone config loaded"
          rclone listremotes

      - name: ▶️ دانلود فایل
        id: download
        run: |
          mkdir -p "${{ github.event.inputs.folder }}"
          cd "${{ github.event.inputs.folder }}"
          
          if [ "${{ github.event.inputs.platform }}" = "youtube" ]; then
            yt-dlp -f "bestaudio[ext=m4a]/bestaudio/best" --audio-format mp3 --audio-quality 0 \
              --cookies ../cookies.txt --no-playlist \
              "${{ github.event.inputs.url }}" \
              -o "%(title)s.%(ext)s"
          else
            yt-dlp -f "bestaudio" --audio-format mp3 --audio-quality 0 \
              --no-playlist \
              "${{ github.event.inputs.url }}" \
              -o "%(title)s.%(ext)s"
          fi
          
          DOWNLOADED_FILE=$(ls -1 | head -1)
          echo "FILE_TITLE=$(basename "$DOWNLOADED_FILE" | sed 's/\.[^.]*$//')" >> $GITHUB_ENV
          echo "DOWNLOADED_FILE=$DOWNLOADED_FILE" >> $GITHUB_ENV
          echo "✅ دانلود انجام شد - فایل: $DOWNLOADED_FILE"

      - name: ✂️ Split into zip volumes (if requested)
        if: github.event.inputs.split_choice == 'split'
        run: |
          cd "${{ github.event.inputs.folder }}"
          FILE="${{ env.DOWNLOADED_FILE }}"
          SIZE="${{ github.event.inputs.split_size }}"
          sudo apt-get update && sudo apt-get install -y zip
          zip -s "$SIZE" "${FILE}.zip" "$FILE"
          rm "$FILE"
          echo "✅ Zip volumes created"
          echo "DOWNLOADED_FILE=${FILE}.zip" >> $GITHUB_ENV

      - name: ☁️ آپلود به Mega.nz
        run: |
          rclone copy "${{ github.event.inputs.folder }}" "mega:${{ github.event.inputs.mega_folder }}" \
            --progress --transfers=4 -vv
          echo "✅ آپلود به Mega.nz انجام شد"

      - name: 🕒 ثبت زمان آپلود (فقط upload_times)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          python .github/scripts/record_upload_time.py "${{ github.event.inputs.folder }}"
          
          git add State/upload_times_*.txt || true
          if git diff --staged --quiet; then
            echo "ℹ️ هیچ تغییری برای commit وجود ندارد."
            exit 0
          fi
          
          # 1. commit
          git commit -m "Update upload times for ${{ github.event.inputs.platform }} - ${{ github.event.inputs.url }}"
          
          # 2. دریافت آخرین تغییرات remote و rebase
          git pull --rebase origin main
          
          # 3. push
          git push origin main
      - name: 🔔 ارسال نوتیفیکیشن به Pushbullet
        if: success() && env.FILE_TITLE != ''
        run: |
          if [ -z "${{ secrets.PB_TOKEN }}" ]; then
            echo "⚠️ سکرت PB_TOKEN تنظیم نشده، نوتیفیکیشن ارسال نشد"
            exit 0
          fi
          
          MESSAGE="✅ دانلود خودکار به مگا اضافه شد: 🎉 دانلود و آپلود خودکار با موفقیت انجام شد!"
          MESSAGE="${MESSAGE}\n📁 پلتفرم: ${{ github.event.inputs.platform }}"
          MESSAGE="${MESSAGE}\n🎬 عنوان: ${{ env.FILE_TITLE }}"
          MESSAGE="${MESSAGE}\n📂 پوشه مقصد در مگا: ${{ github.event.inputs.mega_folder }}"
          MESSAGE="${MESSAGE}\n✂️ تقسیم: ${{ github.event.inputs.split_choice }}"
          
          curl -u "${{ secrets.PB_TOKEN }}": \
            -X POST https://api.pushbullet.com/v2/pushes \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"note\",\"title\":\"✅ دانلود خودکار به مگا اضافه شد\",\"body\":\"$MESSAGE\"}"
          echo "✅ نوتیفیکیشن ارسال شد"
