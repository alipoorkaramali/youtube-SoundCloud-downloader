name: 🎬🎵 Auto Downloader + Mega.nz

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '🌐 پلتفرم'
        required: true
        default: 'youtube'
        type: choice
        options:
          - youtube
          - soundcloud

      url:
        description: '🔗 لینک دانلود'
        required: true

      type:
        description: 'نوع محتوا - برای YouTube همیشه Audio است'
        required: false
        default: 'audio'
        type: string

      quality:
        description: 'کیفیت دانلود'
        required: false
        default: 'best'
        type: string

      folder:
        description: '📁 پوشه در مخزن (موقت)'
        required: false
        default: 'news_downloads'

      mega_folder:
        description: '📂 پوشه در Mega.nz'
        required: false
        default: 'YoutubeNews'

      split_choice:
        description: 'تقسیم فایل به چند قسمت (ZIP volume)؟'
        required: true
        default: 'single'
        type: choice
        options:
          - single
          - split

      split_size:
        description: 'اندازه هر قسمت (مثال: 100M, 500M, 1G)'
        required: false
        default: '100M'


  repository_dispatch:
    types:
      - trigger-download


jobs:

  download:
    runs-on: ubuntu-latest

    timeout-minutes: 120

    permissions:
      contents: write


    steps:

      # ============================================================
      # 1. دریافت Repository
      # ============================================================

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. تنظیم متغیرها از Trigger فعال
      # ============================================================

      - name: ⚙️ تنظیم متغیرها از تریگر فعال
        run: |

          echo "PLATFORM=${{ github.event.client_payload.platform || github.event.inputs.platform || 'youtube' }}" >> $GITHUB_ENV

          echo "URL=${{ github.event.client_payload.url || github.event.inputs.url }}" >> $GITHUB_ENV

          echo "CONTENT_TYPE=${{ github.event.client_payload.type || github.event.inputs.type || 'audio' }}" >> $GITHUB_ENV

          echo "QUALITY=${{ github.event.client_payload.quality || github.event.inputs.quality || 'best' }}" >> $GITHUB_ENV

          echo "FOLDER=${{ github.event.client_payload.folder || github.event.inputs.folder || 'news_downloads' }}" >> $GITHUB_ENV

          echo "MEGA_FOLDER=${{ github.event.client_payload.mega_folder || github.event.inputs.mega_folder || 'YoutubeNews' }}" >> $GITHUB_ENV

          echo "SPLIT_CHOICE=${{ github.event.client_payload.split_choice || github.event.inputs.split_choice || 'single' }}" >> $GITHUB_ENV

          echo "SPLIT_SIZE=${{ github.event.client_payload.split_size || github.event.inputs.split_size || '100M' }}" >> $GITHUB_ENV


      # ============================================================
      # 3. نمایش تنظیمات نهایی
      # ============================================================

      - name: 🔎 نمایش تنظیمات اجرا
        run: |

          echo "=============================================="
          echo "🚀 تنظیمات اجرای Workflow"
          echo "=============================================="

          echo "🌐 PLATFORM     = ${PLATFORM}"
          echo "🔗 URL          = ${URL}"
          echo "🎵 CONTENT_TYPE = ${CONTENT_TYPE}"
          echo "⭐ QUALITY      = ${QUALITY}"
          echo "📁 FOLDER       = ${FOLDER}"
          echo "📂 MEGA_FOLDER  = ${MEGA_FOLDER}"
          echo "✂️ SPLIT_CHOICE = ${SPLIT_CHOICE}"
          echo "📦 SPLIT_SIZE   = ${SPLIT_SIZE}"

          echo "=============================================="


      # ============================================================
      # 4. رمزگشایی Cookies
      # ============================================================

      - name: 🔐 Decrypt cookies
        run: |

          if [ ! -f config/cookies.txt.gpg ]; then
            echo "❌ فایل config/cookies.txt.gpg یافت نشد!"
            exit 1
          fi


          gpg \
            --batch \
            --yes \
            --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" \
            --decrypt config/cookies.txt.gpg \
            > cookies.txt


          if [ ! -s cookies.txt ]; then
            echo "❌ رمزگشایی کوکی ناموفق بود یا فایل خالی است"
            exit 1
          fi


          echo "✅ کوکی با موفقیت رمزگشایی شد"


      # ============================================================
      # 5. نصب yt-dlp و ffmpeg
      # ============================================================

      - name: ⚙️ Setup yt-dlp + ffmpeg
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          aria2: true
          ffmpeg: true
          nightly: true


      # ============================================================
      # 6. نصب آخرین yt-dlp + PO Token Provider
      # ============================================================

      - name: 📦 Install yt-dlp + PO Token Provider
        run: |

          echo "🔄 Updating yt-dlp..."

          python3 -m pip install --upgrade yt-dlp


          echo "🔄 Installing PO Token Provider..."

          python3 -m pip install --upgrade bgutil-ytdlp-pot-provider


          echo ""
          echo "=============================================="
          echo "📌 yt-dlp version"
          echo "=============================================="

          yt-dlp --version


          echo ""
          echo "=============================================="
          echo "✅ yt-dlp + PO Token provider آماده است"
          echo "=============================================="


      # ============================================================
      # 7. نصب rclone
      # ============================================================

      - name: 📦 Install rclone (official with Mega support)
        run: |

          curl https://rclone.org/install.sh | sudo bash

          echo ""
          echo "=============================================="
          echo "📌 rclone version"
          echo "=============================================="

          rclone version


      # ============================================================
      # 8. رمزگشایی rclone config
      # ============================================================

      - name: 🔓 Decrypt rclone config
        run: |

          mkdir -p ~/.config/rclone


          if [ ! -f config/rclone_mega.conf.gpg ]; then
            echo "❌ فایل config/rclone_mega.conf.gpg پیدا نشد!"
            exit 1
          fi


          gpg \
            --quiet \
            --batch \
            --yes \
            --decrypt \
            --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" \
            --output ~/.config/rclone/rclone.conf \
            config/rclone_mega.conf.gpg


          chmod 600 ~/.config/rclone/rclone.conf


          echo "✅ rclone config loaded"


          echo ""
          echo "📌 Remoteهای موجود:"

          rclone listremotes


      # ============================================================
      # 9. دانلود
      # ============================================================

      - name: ▶️ دانلود فایل
        id: download
        run: |

          echo "=============================================="
          echo "🎬 شروع دانلود"
          echo "=============================================="


          # --------------------------------------------------------
          # پاک کردن پوشه قبلی
          # --------------------------------------------------------

          rm -rf "${FOLDER}" 2>/dev/null || true

          mkdir -p "${FOLDER}"

          cd "${FOLDER}"


          # ========================================================
          # گزینه‌های عمومی yt-dlp برای YouTube
          # ========================================================

          COMMON_OPTS="--cookies ../cookies.txt \
            --no-check-formats \
            --extractor-args youtube:player_client=web,android,ios,web_embedded \
            --extractor-args youtube:skip=webpage,age_gate \
            --extractor-retries 10 \
            --retries 30 \
            --fragment-retries 30 \
            --sleep-interval 5 \
            --sleep-subtitles 3 \
            --no-warnings \
            --no-playlist \
            --compat-options no-external-downloader-progress \
            --concurrent-fragments 4"


          # ========================================================
          # YouTube
          # ========================================================

          if [ "${PLATFORM}" = "youtube" ]; then

            echo ""
            echo "=============================================="
            echo "🌐 Platform: YouTube"
            echo "=============================================="

            echo "🔗 URL: ${URL}"
            echo "🎵 حالت: AUDIO ONLY"
            echo "⭐ کیفیت: ${QUALITY}"
            echo ""
            echo "⚠️ توجه:"
            echo "برای YouTube این Workflow فقط صوت دانلود می‌کند."
            echo "هیچ فایل ویدئویی دانلود نخواهد شد."
            echo "=============================================="


            # ------------------------------------------------------
            # فقط Audio
            # ------------------------------------------------------

            yt-dlp ${COMMON_OPTS} \
              -f "bestaudio/best" \
              -x \
              --audio-format mp3 \
              --audio-quality 0 \
              "${URL}" \
              -o "%(title)s.%(ext)s"


          # ========================================================
          # SoundCloud
          # ========================================================

          elif [ "${PLATFORM}" = "soundcloud" ]; then

            echo ""
            echo "=============================================="
            echo "🌐 Platform: SoundCloud"
            echo "=============================================="

            echo "🔗 URL: ${URL}"
            echo "🎵 حالت: AUDIO ONLY"
            echo "⭐ کیفیت: ${QUALITY}"
            echo "=============================================="


            yt-dlp \
              --no-playlist \
              -f "bestaudio/best" \
              -x \
              --audio-format mp3 \
              --audio-quality 0 \
              "${URL}" \
              -o "%(title)s.%(ext)s"


          else

            echo "❌ پلتفرم ناشناخته است: ${PLATFORM}"
            exit 1

          fi


          # ========================================================
          # پیدا کردن فایل دانلود شده
          # ========================================================

          DOWNLOADED_FILE=$(find . -maxdepth 1 -type f -printf '%f\n' | head -1)


          if [ -z "$DOWNLOADED_FILE" ]; then

            echo ""
            echo "❌ هیچ فایلی دانلود نشد!"

            echo ""
            echo "📁 محتویات پوشه:"

            ls -lah

            exit 1

          fi


          # ========================================================
          # اطمینان از اینکه خروجی YouTube واقعاً MP3 است
          # ========================================================

          if [ "${PLATFORM}" = "youtube" ]; then

            FILE_EXTENSION="${DOWNLOADED_FILE##*.}"

            if [ "${FILE_EXTENSION,,}" != "mp3" ]; then

              echo ""
              echo "⚠️ فایل خروجی YouTube MP3 نیست:"
              echo "📁 ${DOWNLOADED_FILE}"

              echo ""
              echo "🔄 تلاش برای تبدیل فایل به MP3..."

              ORIGINAL_FILE="${DOWNLOADED_FILE}"

              ffmpeg \
                -y \
                -i "${ORIGINAL_FILE}" \
                -vn \
                -codec:a libmp3lame \
                -q:a 0 \
                "${ORIGINAL_FILE%.*}.mp3"


              if [ -f "${ORIGINAL_FILE%.*}.mp3" ]; then

                rm -f "${ORIGINAL_FILE}"

                DOWNLOADED_FILE="${ORIGINAL_FILE%.*}.mp3"

                echo "✅ تبدیل به MP3 با موفقیت انجام شد"

              else

                echo "❌ تبدیل به MP3 ناموفق بود"

                exit 1

              fi

            fi

          fi


          # ========================================================
          # ثبت اطلاعات فایل
          # ========================================================

          FILE_TITLE=$(basename "$DOWNLOADED_FILE" | sed 's/\.[^.]*$//')


          echo "FILE_TITLE=${FILE_TITLE}" >> $GITHUB_ENV

          echo "DOWNLOADED_FILE=${DOWNLOADED_FILE}" >> $GITHUB_ENV


          echo ""
          echo "=============================================="
          echo "✅ دانلود با موفقیت انجام شد"
          echo "=============================================="

          echo "📁 فایل: ${DOWNLOADED_FILE}"

          echo "📏 حجم فایل:"

          du -h "${DOWNLOADED_FILE}"


          echo ""
          echo "📂 محتویات پوشه:"

          ls -lah


      # ============================================================
      # 10. Split into ZIP volumes
      # ============================================================

      - name: ✂️ Split into zip volumes (if requested)
        if: env.SPLIT_CHOICE == 'split'
        run: |

          cd "${FOLDER}"


          FILE="${DOWNLOADED_FILE}"

          SIZE="${SPLIT_SIZE}"


          echo "=============================================="
          echo "✂️ تقسیم فایل به ZIP Volume"
          echo "=============================================="

          echo "📁 فایل: ${FILE}"
          echo "📦 اندازه هر قسمت: ${SIZE}"


          sudo apt-get update

          sudo apt-get install -y zip


          echo ""
          echo "📦 در حال ساخت ZIP چندبخشی..."


          zip \
            -s "${SIZE}" \
            "${FILE}.zip" \
            "${FILE}"


          rm -f "${FILE}"


          echo ""
          echo "✅ ZIP volumes created"


          echo ""
          echo "📁 فایل‌های ایجادشده:"

          ls -lah


          echo "DOWNLOADED_FILE=${FILE}.zip" >> $GITHUB_ENV


      # ============================================================
      # 11. آپلود به Mega.nz
      # ============================================================

      - name: ☁️ آپلود به Mega.nz
        run: |

          echo "=============================================="
          echo "☁️ شروع آپلود به Mega.nz"
          echo "=============================================="

          echo "📂 پوشه محلی:"
          echo "   ${FOLDER}"

          echo ""

          echo "📂 پوشه مقصد:"
          echo "   mega:${MEGA_FOLDER}"


          echo ""
          echo "📁 محتویات قبل از آپلود:"

          ls -lah "${FOLDER}"


          echo ""
          echo "☁️ شروع Upload..."


          rclone copy \
            "${FOLDER}" \
            "mega:${MEGA_FOLDER}" \
            --progress \
            --transfers=4 \
            -vv


          echo ""
          echo "=============================================="
          echo "✅ آپلود به Mega.nz با موفقیت انجام شد"
          echo "=============================================="


      # ============================================================
      # 12. ثبت زمان آپلود
      # ============================================================

      - name: 🕒 ثبت زمان آپلود (فقط upload_times)
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "github-actions[bot]@users.noreply.github.com"


          UPLOAD_TIMES_FILE="State/upload_times_${FOLDER}.txt"


          echo "=============================================="
          echo "🕒 ثبت زمان آپلود"
          echo "=============================================="


          # --------------------------------------------------------
          # همسان‌سازی branch محلی با remote
          # --------------------------------------------------------

          git fetch origin main

          git reset --hard origin/main


          # --------------------------------------------------------
          # اجرای اسکریپت ثبت زمان
          # --------------------------------------------------------

          python .github/scripts/record_upload_time.py "${FOLDER}"


          # --------------------------------------------------------
          # اضافه کردن فایل
          # --------------------------------------------------------

          git add "${UPLOAD_TIMES_FILE}"


          # --------------------------------------------------------
          # بررسی تغییرات
          # --------------------------------------------------------

          if git diff --staged --quiet; then

            echo "ℹ️ هیچ تغییری برای commit وجود ندارد."

            exit 0

          fi


          # --------------------------------------------------------
          # Commit
          # --------------------------------------------------------

          git commit \
            -m "Update upload times for ${PLATFORM} - ${URL}"


          # --------------------------------------------------------
          # Push
          # --------------------------------------------------------

          git push origin main


          echo "✅ زمان آپلود ثبت شد"


      # ============================================================
      # 13. Pushbullet Notification
      # ============================================================

      - name: 🔔 ارسال نوتیفیکیشن به Pushbullet
        if: success() && env.FILE_TITLE != ''
        run: |

          if [ -z "${{ secrets.PB_TOKEN }}" ]; then

            echo "⚠️ سکرت PB_TOKEN تنظیم نشده، نوتیفیکیشن ارسال نشد"

            exit 0

          fi


          MESSAGE="✅ دانلود خودکار به مگا اضافه شد: 🎉 دانلود و آپلود خودکار با موفقیت انجام شد!"


          MESSAGE="${MESSAGE}\n📁 پلتفرم: ${PLATFORM}"

          MESSAGE="${MESSAGE}\n🎵 نوع: Audio / MP3"

          MESSAGE="${MESSAGE}\n🎬 عنوان: ${FILE_TITLE}"

          MESSAGE="${MESSAGE}\n📂 پوشه مقصد در مگا: ${MEGA_FOLDER}"

          MESSAGE="${MESSAGE}\n✂️ تقسیم: ${SPLIT_CHOICE}"


          curl \
            -u "${{ secrets.PB_TOKEN }}": \
            -X POST \
            https://api.pushbullet.com/v2/pushes \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"note\",\"title\":\"✅ دانلود خودکار به مگا اضافه شد\",\"body\":\"$MESSAGE\"}"


          echo "✅ نوتیفیکیشن ارسال شد"
