name: 🧹 پاکسازی خودکار JSON کش (بعد از ۲ روز)

on:
  schedule:
    - cron: '0 3 * * *'   # هر روز ساعت ۳ بامداد UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: حذف فایل‌های JSON منقضی شده
        run: |
          CACHE_DIR="temp_instagram_json"
          if [ ! -d "$CACHE_DIR" ]; then
            echo "پوشه کش وجود ندارد"
            exit 0
          fi
          NOW=$(date +%s)
          MAX_AGE=172800
          for file in "$CACHE_DIR"/*.json; do
            if [ -f "$file" ]; then
              CACHE_TIME=$(head -n1 "$file" | grep -oE '[0-9]+' || echo "0")
              AGE=$((NOW - CACHE_TIME))
              if [ $AGE -ge $MAX_AGE ]; then
                echo "🗑️ حذف $file (منقضی شده)"
                rm "$file"
              fi
            fi
          done
      - name: commit تغییرات
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add temp_instagram_json
          git diff --staged --quiet || git commit -m "🧹 پاکسازی خودکار JSON کش" && git push
