name: 📥 دانلود پست از روی کامنت Issue

on:
  issue_comment:
    types: [created]

jobs:
  download:
    if: contains(github.event.comment.body, '/download')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔢 Extract post number from comment
        id: extract
        run: |
          COMMENT="${{ github.event.comment.body }}"
          NUMBER=$(echo "$COMMENT" | grep -oE '/download[[:space:]]+([0-9]+)' | grep -oE '[0-9]+')
          if [ -z "$NUMBER" ]; then
            echo "No number found"
            exit 1
          fi
          echo "post_number=$NUMBER" >> $GITHUB_OUTPUT

      - name: 🐍 Setup Python & yt-dlp
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Install yt-dlp
        run: pip install yt-dlp

      - name: 📦 Install requests (for media_urls download)
        run: pip install requests

      - name: 🎯 Download selected post
        env:
          POST_INDEX: ${{ steps.extract.outputs.post_number }}
        run: python .github/scripts/download_instagram_by_index.py

      - name: 💾 Commit downloaded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram_downloads/
          git diff --staged --quiet || git commit -m "📥 دانلود پست #${{ steps.extract.outputs.post_number }}"
          git push

      - name: 💬 Add success comment to issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          gh issue comment "$ISSUE_NUMBER" --body "✅ پست شماره ${{ steps.extract.outputs.post_number }} با موفقیت دانلود شد. فایل در پوشه `instagram_downloads/` قرار دارد."
