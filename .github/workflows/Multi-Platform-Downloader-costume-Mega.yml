name: 🎬🎵 Costume Downloader + Mega.nz (Smart Optimization)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '🌐 پلتفرم'
        required: true
        default: 'youtube'
        type: choice
        options:
          - youtube
          - soundcloud
      url:
        description: '🔗 لینک دانلود'
        required: true
      type:
        description: 'نوع دانلود'
        required: true
        default: 'audio'
        type: choice
        options:
          - audio
          - video
      optimization_profile:
        description: '⚙️ کیفیت نهایی ویدیو (انتخاب کنید)'
        required: false
        default: 'balanced'
        type: choice
        options:
          - 'balanced'    # ⭐ کیفیت عالی، حجم نصف (پیشفرض)
          - 'quality'     # 🎬 کیفیت فوق‌العاده، حجم کمی کمتر
          - 'size'        # 📱 کیفیت خوب، حجم خیلی کم
          - 'ultra'       # 💾 کیفیت قابل‌قبول، حجم فوق‌العاده کم
          - 'original'    # 🔵 بدون تغییر
      folder:
        description: '📁 پوشه موقت'
        required: false
        default: 'downloads'
      mega_folder:
        description: '📂 پوشه در Mega.nz'
        required: false
        default: 'YoutubeDownloads'
      split_choice:
        description: 'تقسیم فایل به چند قسمت (ZIP volume)؟'
        required: true
        default: 'single'
        type: choice
        options:
          - single
          - split
      split_size:
        description: 'اندازه هر قسمت (مثال: 100M, 500M, 1G)'
        required: false
        default: '100M'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Decrypt Random Cookie
        run: |
          COOKIE_FILES=(config/cookies*.txt.gpg)
          if [ ${#COOKIE_FILES[@]} -eq 0 ]; then
            echo "❌ هیچ فایل cookies*.txt.gpg یافت نشد!"
            exit 1
          fi
          RANDOM_INDEX=$((RANDOM % ${#COOKIE_FILES[@]}))
          SELECTED_FILE="${COOKIE_FILES[$RANDOM_INDEX]}"
          echo "🎲 فایل انتخاب شده: $SELECTED_FILE"
          gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" \
              --decrypt "$SELECTED_FILE" > cookies.txt || {
            echo "❌ GPG Decrypt Failed!"
            exit 1
          }
          echo "✅ کوکی با موفقیت decrypt شد"

      - name: 🔍 Get latest ffmpeg version
        id: get-ffmpeg-version
        run: |
          sudo apt-get update
          VERSION=$(apt-cache show ffmpeg | grep Version | head -1 | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "✅ آخرین نسخه‌ی موجود: $VERSION"

      - name: 💾 Cache ffmpeg binary (smart cache)
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /usr/bin/ffmpeg
          key: ${{ runner.os }}-ffmpeg-${{ env.VERSION }}

      - name: 📦 Install ffmpeg version (if not cached)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          echo "✅ ffmpeg نصب و کش شد."

      - name: ⚙️ Setup yt-dlp (without ffmpeg)
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          aria2: false
          ffmpeg: false
          nightly: true

      - name: 📦 Install PO Token Plugin
        run: |
          python3 -m pip install --upgrade bgutil-ytdlp-pot-provider
          echo "✅ PO Token Plugin installed"

      - name: 💾 Cache rclone binary
        id: cache-rclone
        uses: actions/cache@v4
        with:
          path: ~/bin/rclone
          key: ${{ runner.os }}-rclone-v1.74.1

      - name: 📦 Install latest rclone (if not cached)
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/bin
          cp /usr/bin/rclone ~/bin/rclone
          chmod +x ~/bin/rclone
          ~/bin/rclone version

      - name: 🔓 Decrypt rclone config
        run: |
          mkdir -p ~/.config/rclone
          if [ ! -f config/rclone_mega.conf.gpg ]; then
            echo "❌ فایل rclone_mega.conf.gpg پیدا نشد!"
            exit 1
          fi
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" \
              --output ~/.config/rclone/rclone.conf config/rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf
          echo "✅ rclone config loaded"

      - name: ▶️ دانلود فایل
        id: download
        run: |
          rm -rf "${{ github.event.inputs.folder }}" 2>/dev/null || true
          mkdir -p "${{ github.event.inputs.folder }}"
          cd "${{ github.event.inputs.folder }}"

          COMMON_OPTS="--cookies ../cookies.txt \
            --no-check-formats \
            --extractor-args youtube:player_client=web,android,ios \
            --extractor-args youtube:skip=webpage \
            --extractor-retries 5 \
            --retries 20 \
            --fragment-retries 20 \
            --sleep-interval 4 \
            --sleep-subtitles 2 \
            --no-warnings \
            --ignore-errors \
            --no-playlist \
            --compat-options no-external-downloader-progress"

          if [ "${{ github.event.inputs.platform }}" = "youtube" ]; then
            if [ "${{ github.event.inputs.type }}" = "video" ]; then
              yt-dlp $COMMON_OPTS -f "best" \
                "${{ github.event.inputs.url }}" -o "%(title)s.%(ext)s"
            else
              yt-dlp $COMMON_OPTS -f "bestaudio/best" -x --audio-format mp3 --audio-quality 0 \
                "${{ github.event.inputs.url }}" -o "%(title)s.%(ext)s"
            fi
          else
            if [ "${{ github.event.inputs.type }}" = "video" ]; then
              yt-dlp $COMMON_OPTS -f "best" \
                "${{ github.event.inputs.url }}" -o "%(title)s.%(ext)s"
            else
              yt-dlp $COMMON_OPTS -f "bestaudio/best" -x --audio-format mp3 --audio-quality 0 \
                "${{ github.event.inputs.url }}" -o "%(title)s.%(ext)s"
            fi
          fi

          DOWNLOADED_FILE=$(ls -1 | head -1)
          if [ -z "$DOWNLOADED_FILE" ]; then
            echo "❌ هیچ فایلی دانلود نشد!"
            ls -la
            exit 1
          fi
          echo "DOWNLOADED_FILE=$DOWNLOADED_FILE" >> $GITHUB_ENV
          echo "✅ دانلود با موفقیت انجام شد - فایل: $DOWNLOADED_FILE"

      - name: 🗜️ پردازش ویدیو (بهینه‌سازی هوشمند)
        if: github.event.inputs.type == 'video' && github.event.inputs.optimization_profile != 'original'
        run: |
          cd "${{ github.event.inputs.folder }}"
          INPUT_FILE="${{ env.DOWNLOADED_FILE }}"
          BASENAME="${INPUT_FILE%.*}"
          OUTPUT_FILE="${BASENAME}_optimized.mp4"

          PROFILE="${{ github.event.inputs.optimization_profile }}"

          case "$PROFILE" in
            "balanced")
              RESOLUTION="1280:720"
              CODEC="libx265"
              CRF="28"
              PRESET="medium"
              AUDIO_BITRATE="128k"
              LABEL="⭐ کیفیت عالی، حجم نصف (پیشفرض)"
              ;;
            "quality")
              RESOLUTION="1920:1080"
              CODEC="libx265"
              CRF="26"
              PRESET="medium"
              AUDIO_BITRATE="160k"
              LABEL="🎬 کیفیت فوق‌العاده، حجم کمی کمتر"
              ;;
            "size")
              RESOLUTION="854:480"
              CODEC="libx265"
              CRF="32"
              PRESET="fast"
              AUDIO_BITRATE="96k"
              LABEL="📱 کیفیت خوب، حجم خیلی کم"
              ;;
            "ultra")
              RESOLUTION="640:360"
              CODEC="libx265"
              CRF="35"
              PRESET="veryfast"
              AUDIO_BITRATE="64k"
              LABEL="💾 کیفیت قابل‌قبول، حجم فوق‌العاده کم"
              ;;
          esac

          FFMPEG_CMD="ffmpeg -i \"$INPUT_FILE\""
          FFMPEG_CMD="$FFMPEG_CMD -vf \"scale=$RESOLUTION:flags=lanczos\""
          FFMPEG_CMD="$FFMPEG_CMD -c:v $CODEC -crf $CRF -preset $PRESET"
          FFMPEG_CMD="$FFMPEG_CMD -c:a aac -b:a $AUDIO_BITRATE"
          FFMPEG_CMD="$FFMPEG_CMD -movflags +faststart -stats -loglevel error \"$OUTPUT_FILE\""

          echo "📐 شروع بهینه‌سازی با پروفایل: $LABEL"
          echo "   رزولوشن: $RESOLUTION"
          echo "   کدک: $CODEC | CRF: $CRF | پریست: $PRESET"
          echo "   کیفیت صدا: $AUDIO_BITRATE"
          echo ""
          echo "🔄 در حال اجرای ffmpeg..."

          eval $FFMPEG_CMD

          if [ -f "$OUTPUT_FILE" ]; then
            ORIGINAL_SIZE=$(stat -c%s "$INPUT_FILE")
            COMPRESSED_SIZE=$(stat -c%s "$OUTPUT_FILE")
            REDUCTION=$((100 - (COMPRESSED_SIZE * 100 / ORIGINAL_SIZE)))
            echo ""
            echo "✅ بهینه‌سازی با موفقیت انجام شد!"
            echo "   حجم اصلی: $(numfmt --to=iec $ORIGINAL_SIZE)"
            echo "   حجم نهایی: $(numfmt --to=iec $COMPRESSED_SIZE)"
            echo "   کاهش حجم: ~${REDUCTION}٪"

            if [ $REDUCTION -lt 0 ]; then
              echo "⚠️ توجه: حجم فایل افزایش یافته است."
              echo "💡 پیشنهاد: از پروفایل 'size' یا 'ultra' استفاده کنید."
            fi

            rm "$INPUT_FILE"
            echo "DOWNLOADED_FILE=$OUTPUT_FILE" >> $GITHUB_ENV
          else
            echo "⚠️ خطا در بهینه‌سازی. فایل اصلی حفظ می‌شود."
            echo "DOWNLOADED_FILE=$INPUT_FILE" >> $GITHUB_ENV
          fi

      - name: ✂️ Split into zip volumes (if requested)
        if: github.event.inputs.split_choice == 'split'
        run: |
          cd "${{ github.event.inputs.folder }}"
          FILE="${{ env.DOWNLOADED_FILE }}"
          SIZE="${{ github.event.inputs.split_size }}"
          sudo apt-get update && sudo apt-get install -y zip
          echo "📦 ایجاد فایل‌های ZIP با حجم هر قسمت: $SIZE"
          zip -s "$SIZE" "${FILE}.zip" "$FILE"
          rm "$FILE"
          echo "✅ فایل‌های ZIP چندبخشی با موفقیت ساخته شدند:"
          ls -la

      - name: ☁️ آپلود به Mega.nz
        run: |
          CONFIG_FILE="$HOME/.config/rclone/rclone.conf"
          REMOTE_PATH="mega:${{ github.event.inputs.mega_folder }}"

          echo "📁 محتویات پوشه محلی '${{ github.event.inputs.folder }}':"
          ls -la "${{ github.event.inputs.folder }}"

          echo "🟢 بررسی وجود فایل rclone:"
          ls -la ~/bin/rclone
          ~/bin/rclone version || { echo "⚠️ rclone قابل اجرا نیست"; exit 1; }

          echo "🔄 تست اتصال به Mega:"
          ~/bin/rclone --config "$CONFIG_FILE" lsd mega: || { echo "❌ اتصال به مگا برقرار نیست"; exit 1; }

          echo "📂 ایجاد پوشه در مگا: $REMOTE_PATH"
          ~/bin/rclone --config "$CONFIG_FILE" mkdir "$REMOTE_PATH" 2>&1

          echo "☁️ شروع آپلود..."
          ~/bin/rclone --config "$CONFIG_FILE" copy "${{ github.event.inputs.folder }}" "$REMOTE_PATH" \
            --progress --transfers=4 -vv

          echo "🔍 لیست نهایی فایل‌ها در مگا:"
          ~/bin/rclone --config "$CONFIG_FILE" ls "$REMOTE_PATH"
