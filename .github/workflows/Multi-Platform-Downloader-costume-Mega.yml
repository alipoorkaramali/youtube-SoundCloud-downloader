name: 🎬🎵 costume Downloader + Mega.nz (Stable Ultra Fix)

on:
  workflow_dispatch:
    inputs:
      platform:
        required: true
        default: 'youtube'
        type: choice
        options: [youtube, soundcloud]
      url:
        required: true
      type:
        required: true
        default: 'audio'
        type: choice
        options: [audio, video]
      quality:
        default: 'best'
        type: choice
        options: ['144p','240p','360p','480p','720p','1080p','best']
      folder:
        default: 'downloads'
      mega_folder:
        default: 'YoutubeDownloads'
      split_choice:
        default: 'single'
        type: choice
        options: [single, split]
      split_size:
        default: '100M'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ================= COOKIES =================
      - name: 🔐 Decrypt cookies
        run: |
          gpg --batch --yes \
            --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" \
            --decrypt cookies.txt.gpg > cookies.txt

      # ================= INSTALL =================
      - name: ⚙️ Install yt-dlp + ffmpeg
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          ffmpeg: true
          aria2: true

      # ✅ FIX اصلی (همونی که ارور تو بود)
      - name: 📦 Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      # ================= RCLONE CONFIG =================
      - name: 🔓 Load rclone config
        run: |
          mkdir -p ~/.config/rclone
          gpg --batch --yes \
            --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" \
            rclone_mega.conf.gpg > ~/.config/rclone/rclone.conf

      # ================= CLEAN =================
      - name: 🧹 Clean
        run: rm -rf "${{ github.event.inputs.folder }}" || true

      # ================= YOUTUBE PRO =================
      - name: ▶️ YouTube Smart Downloader
        if: github.event.inputs.platform == 'youtube'
        run: |
          mkdir -p "${{ github.event.inputs.folder }}"
          cd "${{ github.event.inputs.folder }}"

          URL="${{ github.event.inputs.url }}"

          BASE="\
            --cookies ../cookies.txt \
            --force-ipv4 \
            --no-playlist \
            --retries 8 \
            --fragment-retries 8 \
            --sleep-interval 8 \
            --max-sleep-interval 25 \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.6367.91 Safari/537.36' \
          "

          if [ "${{ github.event.inputs.type }}" = "video" ]; then
            FORMAT="bestvideo+bestaudio/best"
            EXTRA="--merge-output-format mp4"
          else
            FORMAT="bestaudio/best"
            EXTRA="-x --audio-format mp3"
          fi

          try () {
            yt-dlp -f "$FORMAT" $EXTRA $BASE \
              --extractor-args "youtube:player_client=$1" \
              "$URL" -o "%(title)s.%(ext)s"
          }

          try android || try web || try ios || try mweb || exit 1

          FILE=$(ls | head -1)
          echo "DOWNLOADED_FILE=$FILE" >> $GITHUB_ENV
          echo "VIDEO_TITLE=$(basename "$FILE")" >> $GITHUB_ENV

      # ================= SOUNDCLOUD =================
      - name: ☁️ SoundCloud
        if: github.event.inputs.platform == 'soundcloud'
        run: |
          mkdir -p "${{ github.event.inputs.folder }}"
          cd "${{ github.event.inputs.folder }}"
          yt-dlp -x --audio-format mp3 "${{ github.event.inputs.url }}"
          FILE=$(ls | head -1)
          echo "DOWNLOADED_FILE=$FILE" >> $GITHUB_ENV

      # ================= SPLIT =================
      - name: ✂️ Split
        if: github.event.inputs.split_choice == 'split'
        run: |
          cd "${{ github.event.inputs.folder }}"
          sudo apt-get install -y zip
          zip -s "${{ github.event.inputs.split_size }}" file.zip *

      # ================= MEGA =================
      - name: ☁️ Upload Mega
        run: |
          rclone copy "${{ github.event.inputs.folder }}" \
            "mega:${{ github.event.inputs.mega_folder }}" \
            --progress --transfers=4

      # ================= NOTIFY =================
      - name: 📱 Notify
        if: success()
        run: |
          curl -u "${{ secrets.PB_TOKEN }}": \
            -X POST https://api.pushbullet.com/v2/pushes \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"note\",\"title\":\"Done\",\"body\":\"${{ env.VIDEO_TITLE }}\"}"
