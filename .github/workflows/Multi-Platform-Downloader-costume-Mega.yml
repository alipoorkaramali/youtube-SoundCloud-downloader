name: 🎬🎵 Costume Downloader + Mega.nz (with ZIP split)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '🌐 پلتفرم'
        required: true
        default: 'youtube'
        type: choice
        options:
          - youtube
          - soundcloud
      url:
        description: '🔗 لینک دانلود'
        required: true
      type:
        description: 'نوع دانلود'
        required: true
        default: 'audio'
        type: choice
        options:
          - audio
          - video
      quality:
        description: '🎬 کیفیت ویدیو (فقط برای حالت ویدیو)'
        required: false
        default: 'best'
        type: choice
        options:
          - '144p'
          - '240p'
          - '360p'
          - '480p'
          - '720p'
          - '1080p'
          - 'best'
      folder:
        description: '📁 پوشه موقت'
        required: false
        default: 'downloads'
      mega_folder:
        description: '📂 پوشه در Mega.nz'
        required: false
        default: 'YoutubeDownloads'
      split_choice:
        description: 'تقسیم فایل به چند قسمت (ZIP volume)؟'
        required: true
        default: 'single'
        type: choice
        options:
          - single
          - split
      split_size:
        description: 'اندازه هر قسمت (مثال: 100M, 500M, 1G)'
        required: false
        default: '100M'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Decrypt Random Cookie
        run: |
          COOKIE_NUM=$((RANDOM % 4 + 1))
          echo "🎲 Using Cookie #${COOKIE_NUM}"
          
          cp "cookies${COOKIE_NUM}.txt.gpg" cookies_temp.gpg 2>/dev/null || {
            echo "❌ فایل cookies${COOKIE_NUM}.txt.gpg پیدا نشد!"
            exit 1
          }
          
          gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" \
              --decrypt cookies_temp.gpg > cookies.txt || {
            echo "❌ GPG Decrypt Failed!"
            exit 1
          }
          
          rm -f cookies_temp.gpg
          echo "✅ Cookie #${COOKIE_NUM} decrypted successfully"

      - name: ⚙️ Setup yt-dlp + ffmpeg
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          aria2: true
          ffmpeg: true

      - name: 📦 Install PO Token Plugin
        run: |
          python3 -m pip install --upgrade bgutil-ytdlp-pot-provider
          echo "✅ PO Token Plugin installed"

      - name: 💾 Cache rclone binary
        id: cache-rclone
        uses: actions/cache@v4
        with:
          path: /usr/bin/rclone
          key: ${{ runner.os }}-rclone-v1.74.0

      - name: 📦 Install latest rclone (if not cached)
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: 🔓 Decrypt rclone config
        run: |
          mkdir -p ~/.config/rclone
          if [ ! -f rclone_mega.conf.gpg ]; then
            echo "❌ فایل rclone_mega.conf.gpg پیدا نشد!"
            exit 1
          fi
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" \
              --output ~/.config/rclone/rclone.conf rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf
          echo "✅ rclone config loaded"

            - name: ▶️ دانلود فایل
        id: download
        run: |
          rm -rf "${{ github.event.inputs.folder }}" 2>/dev/null || true
          mkdir -p "${{ github.event.inputs.folder }}"
          cd "${{ github.event.inputs.folder }}"
          
          # گزینه‌های مشترک (بدون نقل قول اضافی)
          COMMON_OPTS="--cookies ../cookies.txt \
            --extractor-retries 5 \
            --retries 20 \
            --fragment-retries 20 \
            --sleep-interval 4 \
            --sleep-subtitles 2 \
            --no-warnings \
            --extractor-args youtube:player_client=web,android,ios,web_safari \
            --ignore-errors"

          if [ "${{ github.event.inputs.platform }}" = "youtube" ]; then
          
      - name: ✂️ Split into zip volumes (if requested)
        if: github.event.inputs.split_choice == 'split'
        run: |
          cd "${{ github.event.inputs.folder }}"
          FILE="${{ env.DOWNLOADED_FILE }}"
          SIZE="${{ github.event.inputs.split_size }}"
          sudo apt-get install -y zip
          echo "Creating zip volumes of $SIZE from $FILE"
          zip -s "$SIZE" "${FILE}.zip" "$FILE"
          rm "$FILE"
          echo "✅ Zip volumes created:"
          ls -la

      - name: ☁️ آپلود به Mega.nz
        run: |
          CONFIG_FILE="$HOME/.config/rclone/rclone.conf"
          REMOTE_PATH="mega:${{ github.event.inputs.mega_folder }}"
          rclone --config "$CONFIG_FILE" mkdir "$REMOTE_PATH" 2>/dev/null || true
          rclone --config "$CONFIG_FILE" copy "${{ github.event.inputs.folder }}" "$REMOTE_PATH" --progress --transfers=4 --verbose
          echo "✅ آپلود با موفقیت انجام شد"
