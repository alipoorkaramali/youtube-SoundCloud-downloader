name: 🎬🎵 costume Downloader + Mega.nz (Ultra Pro Anti-Bot)

on:
  workflow_dispatch:
    inputs:
      platform:
        required: true
        default: 'youtube'
        type: choice
        options: [youtube, soundcloud]
      url:
        required: true
      type:
        required: true
        default: 'audio'
        type: choice
        options: [audio, video]
      quality:
        default: 'best'
        type: choice
        options: ['144p','240p','360p','480p','720p','1080p','best']
      folder:
        default: 'downloads'
      mega_folder:
        default: 'YoutubeDownloads'
      split_choice:
        default: 'single'
        type: choice
        options: [single, split]
      split_size:
        default: '100M'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ================= COOKIES =================
      - name: 🔐 Decrypt cookies
        run: |
          gpg --batch --yes \
            --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" \
            --decrypt cookies.txt.gpg > cookies.txt

      # ================= INSTALL =================
      - name: ⚙️ Install tools
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          ffmpeg: true
          aria2: true

      # ================= YOUTUBE =================
      - name: ▶️ YouTube Ultra Anti-Bot
        if: github.event.inputs.platform == 'youtube'
        run: |
          mkdir -p "${{ github.event.inputs.folder }}"
          cd "${{ github.event.inputs.folder }}"

          URL="${{ github.event.inputs.url }}"

          BASE="\
            --cookies ../cookies.txt \
            --force-ipv4 \
            --no-playlist \
            --retries 10 \
            --fragment-retries 10 \
            --retry-sleep 5 \
            --sleep-interval 10 \
            --max-sleep-interval 30 \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.6367.91 Safari/537.36' \
          "

          if [ "${{ github.event.inputs.type }}" = "video" ]; then
            FORMAT="bestvideo+bestaudio/best"
            EXTRA="--merge-output-format mp4"
          else
            FORMAT="bestaudio/best"
            EXTRA="-x --audio-format mp3"
          fi

          attempt () {
            CLIENT=$1
            SKIP=$2

            yt-dlp -f "$FORMAT" \
              $EXTRA \
              $BASE \
              --extractor-args "youtube:player_client=$CLIENT" \
              --extractor-args "youtube:skip=$SKIP" \
              "$URL" \
              -o "%(title)s.%(ext)s" 2>&1 | tee log.txt

            if grep -q "Sign in to confirm you're not a bot" log.txt; then
              return 1
            fi

            return 0
          }

          SUCCESS=0
          DELAY=5

          for CLIENT in android web ios mweb; do
            for SKIP in webpage ""; do
              echo "🚀 Trying $CLIENT / skip=$SKIP"
              attempt $CLIENT $SKIP && SUCCESS=1 && break
              echo "⏳ Retry after $DELAY sec..."
              sleep $DELAY
              DELAY=$((DELAY+5))
            done
            [ $SUCCESS -eq 1 ] && break
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "❌ All attempts failed"
            exit 1
          fi

          FILE=$(ls | head -1)
          echo "DOWNLOADED_FILE=$FILE" >> $GITHUB_ENV
          echo "VIDEO_TITLE=$(basename "$FILE")" >> $GITHUB_ENV

      # ================= SOUNDCLOUD =================
      - name: ☁️ SoundCloud
        if: github.event.inputs.platform == 'soundcloud'
        run: |
          mkdir -p "${{ github.event.inputs.folder }}"
          cd "${{ github.event.inputs.folder }}"
          yt-dlp -x --audio-format mp3 "${{ github.event.inputs.url }}"
          FILE=$(ls | head -1)
          echo "DOWNLOADED_FILE=$FILE" >> $GITHUB_ENV

      # ================= SPLIT =================
      - name: ✂️ Split
        if: github.event.inputs.split_choice == 'split'
        run: |
          cd "${{ github.event.inputs.folder }}"
          sudo apt-get install -y zip
          zip -s "${{ github.event.inputs.split_size }}" file.zip *

      # ================= MEGA =================
      - name: ☁️ Upload Mega
        run: |
          mkdir -p ~/.config/rclone
          gpg --batch --yes \
            --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" \
            rclone_mega.conf.gpg > ~/.config/rclone/rclone.conf

          rclone copy "${{ github.event.inputs.folder }}" \
            "mega:${{ github.event.inputs.mega_folder }}"

      # ================= NOTIFY =================
      - name: 📱 Notify
        if: success()
        run: |
          curl -u "${{ secrets.PB_TOKEN }}": \
            -X POST https://api.pushbullet.com/v2/pushes \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"note\",\"title\":\"Done\",\"body\":\"${{ env.VIDEO_TITLE }}\"}"
