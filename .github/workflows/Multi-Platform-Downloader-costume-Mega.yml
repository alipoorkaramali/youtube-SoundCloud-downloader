name: 🎬🎵 Costume Downloader + Mega.nz (with ZIP split + Quality Control)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '🌐 پلتفرم'
        required: true
        default: 'youtube'
        type: choice
        options:
          - youtube
          - soundcloud
      url:
        description: '🔗 لینک دانلود'
        required: true
      type:
        description: 'نوع دانلود'
        required: true
        default: 'audio'
        type: choice
        options:
          - audio
          - video
      # =============== ورودی‌های جدید برای کنترل کیفیت ===============
      video_quality:
        description: '🎬 کیفیت نهایی ویدیو (فقط برای حالت ویدیو)'
        required: false
        default: 'original'
        type: choice
        options:
          - 'original'   # بدون تغییر
          - '1080p'      # کاهش به 1080p
          - '720p'       # کاهش به 720p
          - '480p'       # کاهش به 480p
          - 'custom'     # ابعاد دلخواه (در ورودی بعدی مشخص می‌شود)
      custom_resolution:
        description: '📐 ابعاد دلخواه (مثال: 854x480 یا 1280x720) - فقط در صورت انتخاب custom'
        required: false
        default: '1280x720'
      video_codec:
        description: '🎞️ کدک ویدیو برای فشرده‌سازی'
        required: false
        default: 'libx264'
        type: choice
        options:
          - 'libx264'    # H.264 (سازگار با اکثر دستگاه‌ها)
          - 'libx265'    # H.265 (حجم کمتر، کیفیت بهتر، اما سازگاری کمتر)
      crf_value:
        description: '🎚️ فاکتور کیفیت (CRF) - عدد کمتر = کیفیت بالاتر و حجم بیشتر'
        required: false
        default: '23'
      preset:
        description: '⚡ سرعت پردازش (سریع‌تر = حجم بیشتر، کندتر = حجم کمتر و کیفیت بهتر)'
        required: false
        default: 'medium'
        type: choice
        options:
          - 'ultrafast'
          - 'superfast'
          - 'veryfast'
          - 'faster'
          - 'fast'
          - 'medium'
          - 'slow'
          - 'slower'
          - 'veryslow'
      # ================================================================
      folder:
        description: '📁 پوشه موقت'
        required: false
        default: 'downloads'
      mega_folder:
        description: '📂 پوشه در Mega.nz'
        required: false
        default: 'YoutubeDownloads'
      split_choice:
        description: 'تقسیم فایل به چند قسمت (ZIP volume)؟'
        required: true
        default: 'single'
        type: choice
        options:
          - single
          - split
      split_size:
        description: 'اندازه هر قسمت (مثال: 100M, 500M, 1G)'
        required: false
        default: '100M'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ================================================================
      # 1. دریافت کد مخزن
      # ================================================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ================================================================
      # 2. رمزگشایی کوکی (انتخاب تصادفی از چند فایل)
      # ================================================================
      - name: 🔐 Decrypt Random Cookie
        run: |
          COOKIE_FILES=(config/cookies*.txt.gpg)
          if [ ${#COOKIE_FILES[@]} -eq 0 ]; then
            echo "❌ هیچ فایل cookies*.txt.gpg یافت نشد!"
            exit 1
          fi
          RANDOM_INDEX=$((RANDOM % ${#COOKIE_FILES[@]}))
          SELECTED_FILE="${COOKIE_FILES[$RANDOM_INDEX]}"
          echo "🎲 فایل انتخاب شده: $SELECTED_FILE"
          gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" \
              --decrypt "$SELECTED_FILE" > cookies.txt || {
            echo "❌ GPG Decrypt Failed!"
            exit 1
          }
          echo "✅ کوکی با موفقیت decrypt شد"

      # ================================================================
      # 3. نصب yt-dlp و ffmpeg (با کش خودکار)
      # ================================================================
      - name: ⚙️ Setup yt-dlp + ffmpeg
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          aria2: false
          ffmpeg: true
          nightly: true

      # ================================================================
      # 4. نصب افزونه PO Token
      # ================================================================
      - name: 📦 Install PO Token Plugin
        run: |
          python3 -m pip install --upgrade bgutil-ytdlp-pot-provider
          echo "✅ PO Token Plugin installed"

      # ================================================================
      # 5. کش کردن rclone
      # ================================================================
      - name: 💾 Cache rclone binary
        id: cache-rclone
        uses: actions/cache@v4
        with:
          path: ~/bin/rclone
          key: ${{ runner.os }}-rclone-v1.74.1

      - name: 📦 Install latest rclone (if not cached)
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/bin
          cp /usr/bin/rclone ~/bin/rclone
          chmod +x ~/bin/rclone
          ~/bin/rclone version

      # ================================================================
      # 6. رمزگشایی تنظیمات rclone
      # ================================================================
      - name: 🔓 Decrypt rclone config
        run: |
          mkdir -p ~/.config/rclone
          if [ ! -f config/rclone_mega.conf.gpg ]; then
            echo "❌ فایل rclone_mega.conf.gpg پیدا نشد!"
            exit 1
          fi
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" \
              --output ~/.config/rclone/rclone.conf config/rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf
          echo "✅ rclone config loaded"

      # ================================================================
      # 7. دانلود فایل (بدون انتخاب کیفیت - همیشه بهترین)
      # ================================================================
      - name: ▶️ دانلود فایل
        id: download
        run: |
          rm -rf "${{ github.event.inputs.folder }}" 2>/dev/null || true
          mkdir -p "${{ github.event.inputs.folder }}"
          cd "${{ github.event.inputs.folder }}"
          
          # گزینه‌های مشترک برای yt-dlp (تضمین‌شده)
          COMMON_OPTS="--cookies ../cookies.txt \
            --no-check-formats \
            --extractor-args youtube:player_client=web,android,ios \
            --extractor-args youtube:skip=webpage \
            --extractor-retries 5 \
            --retries 20 \
            --fragment-retries 20 \
            --sleep-interval 4 \
            --sleep-subtitles 2 \
            --no-warnings \
            --ignore-errors \
            --no-playlist \
            --compat-options no-external-downloader-progress"

          # ============= یوتیوب =============
          if [ "${{ github.event.inputs.platform }}" = "youtube" ]; then
            if [ "${{ github.event.inputs.type }}" = "video" ]; then
              # بهترین فرمت کامل موجود
              yt-dlp $COMMON_OPTS -f "best" \
                "${{ github.event.inputs.url }}" -o "%(title)s.%(ext)s"
            else
              # دانلود صوتی
              yt-dlp $COMMON_OPTS -f "bestaudio/best" -x --audio-format mp3 --audio-quality 0 \
                "${{ github.event.inputs.url }}" -o "%(title)s.%(ext)s"
            fi

          # ============= ساندکلاد =============
          else
            if [ "${{ github.event.inputs.type }}" = "video" ]; then
              yt-dlp $COMMON_OPTS -f "best" \
                "${{ github.event.inputs.url }}" -o "%(title)s.%(ext)s"
            else
              yt-dlp $COMMON_OPTS -f "bestaudio/best" -x --audio-format mp3 --audio-quality 0 \
                "${{ github.event.inputs.url }}" -o "%(title)s.%(ext)s"
            fi
          fi
         
          DOWNLOADED_FILE=$(ls -1 | head -1)
          if [ -z "$DOWNLOADED_FILE" ]; then
            echo "❌ هیچ فایلی دانلود نشد!"
            ls -la
            exit 1
          fi
          echo "DOWNLOADED_FILE=$DOWNLOADED_FILE" >> $GITHUB_ENV
          echo "✅ دانلود با موفقیت انجام شد - فایل: $DOWNLOADED_FILE"

      # ================================================================
      # 8. کاهش کیفیت ویدیو با ffmpeg (فقط برای حالت ویدیو)
      # ================================================================
      - name: 🗜️ کاهش کیفیت ویدیو (اختیاری)
        if: github.event.inputs.type == 'video' && github.event.inputs.video_quality != 'original'
        run: |
          cd "${{ github.event.inputs.folder }}"
          INPUT_FILE="${{ env.DOWNLOADED_FILE }}"
          
          # تعیین ابعاد بر اساس انتخاب کاربر
          QUALITY="${{ github.event.inputs.video_quality }}"
          case "$QUALITY" in
            "1080p")
              RESOLUTION="1920:1080"
              ;;
            "720p")
              RESOLUTION="1280:720"
              ;;
            "480p")
              RESOLUTION="854:480"
              ;;
            "custom")
              RESOLUTION="${{ github.event.inputs.custom_resolution }}"
              ;;
          esac
          
          # تعیین کدک و CRF
          CODEC="${{ github.event.inputs.video_codec }}"
          CRF="${{ github.event.inputs.crf_value }}"
          PRESET="${{ github.event.inputs.preset }}"
          
          # نام فایل خروجی
          BASENAME="${INPUT_FILE%.*}"
          EXTENSION="${INPUT_FILE##*.}"
          OUTPUT_FILE="${BASENAME}_${QUALITY}.mp4"
          
          echo "📐 شروع کاهش کیفیت به $RESOLUTION با کدک $CODEC و CRF=$CRF ..."
          
          # اجرای ffmpeg با تنظیمات انتخاب‌شده
          ffmpeg -i "$INPUT_FILE" \
            -vf "scale=$RESOLUTION:flags=lanczos" \
            -c:v "$CODEC" \
            -crf "$CRF" \
            -preset "$PRESET" \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            "$OUTPUT_FILE"
          
          # بررسی موفقیت
          if [ -f "$OUTPUT_FILE" ]; then
            echo "✅ کیفیت ویدیو با موفقیت کاهش یافت."
            rm "$INPUT_FILE"
            echo "DOWNLOADED_FILE=$OUTPUT_FILE" >> $GITHUB_ENV
          else
            echo "⚠️ خطا در کاهش کیفیت. فایل اصلی حفظ می‌شود."
            # فایل اصلی را حفظ کن
            echo "DOWNLOADED_FILE=$INPUT_FILE" >> $GITHUB_ENV
          fi

      # ================================================================
      # 9. تقسیم فایل به ZIP چندبخشی (در صورت درخواست)
      # ================================================================
      - name: ✂️ Split into zip volumes (if requested)
        if: github.event.inputs.split_choice == 'split'
        run: |
          cd "${{ github.event.inputs.folder }}"
          FILE="${{ env.DOWNLOADED_FILE }}"
          SIZE="${{ github.event.inputs.split_size }}"
          sudo apt-get update && sudo apt-get install -y zip
          echo "Creating zip volumes of $SIZE from $FILE"
          zip -s "$SIZE" "${FILE}.zip" "$FILE"
          rm "$FILE"
          echo "✅ Zip volumes created:"
          ls -la

      # ================================================================
      # 10. آپلود به Mega.nz
      # ================================================================
      - name: ☁️ آپلود به Mega.nz
        run: |
          CONFIG_FILE="$HOME/.config/rclone/rclone.conf"
          REMOTE_PATH="mega:${{ github.event.inputs.mega_folder }}"
          
          echo "📁 محتویات پوشه محلی '${{ github.event.inputs.folder }}':"
          ls -la "${{ github.event.inputs.folder }}"
          
          echo "🟢 بررسی وجود فایل rclone:"
          ls -la ~/bin/rclone
          ~/bin/rclone version || { echo "⚠️ rclone قابل اجرا نیست"; exit 1; }
          
          echo "🔄 تست اتصال به Mega:"
          ~/bin/rclone --config "$CONFIG_FILE" lsd mega: || { echo "❌ اتصال به مگا برقرار نیست"; exit 1; }
          
          echo "📂 ایجاد پوشه در مگا: $REMOTE_PATH"
          ~/bin/rclone --config "$CONFIG_FILE" mkdir "$REMOTE_PATH" 2>&1
          
          echo "☁️ شروع آپلود..."
          ~/bin/rclone --config "$CONFIG_FILE" copy "${{ github.event.inputs.folder }}" "$REMOTE_PATH" \
            --progress --transfers=4 -vv
          
          echo "🔍 لیست نهایی فایل‌ها در مگا:"
          ~/bin/rclone --config "$CONFIG_FILE" ls "$REMOTE_PATH"
