name: 🎬🎵 Costume Downloader + Mega.nz (with ZIP split)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '🌐 پلتفرم'
        required: true
        default: 'youtube'
        type: choice
        options:
          - youtube
          - soundcloud
      url:
        description: '🔗 لینک دانلود'
        required: true
      type:
        description: 'نوع دانلود'
        required: true
        default: 'audio'
        type: choice
        options:
          - audio
          - video
      folder:
        description: '📁 پوشه موقت'
        required: false
        default: 'downloads'
      mega_folder:
        description: '📂 پوشه در Mega.nz'
        required: false
        default: 'YoutubeDownloads'
      split_choice:
        description: 'تقسیم فایل به چند قسمت (ZIP volume)؟'
        required: true
        default: 'single'
        type: choice
        options:
          - single
          - split
      split_size:
        description: 'اندازه هر قسمت (مثال: 100M, 500M, 1G)'
        required: false
        default: '100M'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Decrypt Random Cookie
        run: |
          COOKIE_FILES=(config/cookies*.txt.gpg)
          if [ ${#COOKIE_FILES[@]} -eq 0 ]; then
            echo "❌ هیچ فایل cookies*.txt.gpg یافت نشد!"
            exit 1
          fi
          RANDOM_INDEX=$((RANDOM % ${#COOKIE_FILES[@]}))
          SELECTED_FILE="${COOKIE_FILES[$RANDOM_INDEX]}"
          echo "🎲 فایل انتخاب شده: $SELECTED_FILE"
          gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" \
              --decrypt "$SELECTED_FILE" > cookies.txt || {
            echo "❌ GPG Decrypt Failed!"
            exit 1
          }
          echo "✅ کوکی با موفقیت decrypt شد"

      - name: ⚙️ Setup yt-dlp + ffmpeg
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          aria2: false
          ffmpeg: true
          nightly: true

      - name: 📦 Install PO Token Plugin
        run: |
          python3 -m pip install --upgrade bgutil-ytdlp-pot-provider
          echo "✅ PO Token Plugin installed"

      - name: 💾 Cache rclone binary
        id: cache-rclone
        uses: actions/cache@v4
        with:
          path: ~/bin/rclone
          key: ${{ runner.os }}-rclone-v1.74.1

      - name: 📦 Install latest rclone (if not cached)
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/bin
          cp /usr/bin/rclone ~/bin/rclone
          chmod +x ~/bin/rclone
          ~/bin/rclone version

      - name: 🔓 Decrypt rclone config
        run: |
          mkdir -p ~/.config/rclone
          if [ ! -f config/rclone_mega.conf.gpg ]; then
            echo "❌ فایل rclone_mega.conf.gpg پیدا نشد!"
            exit 1
          fi
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" \
              --output ~/.config/rclone/rclone.conf config/rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf
          echo "✅ rclone config loaded"

      - name: ▶️ دانلود فایل
        id: download
        run: |
          rm -rf "${{ github.event.inputs.folder }}" 2>/dev/null || true
          mkdir -p "${{ github.event.inputs.folder }}"
          cd "${{ github.event.inputs.folder }}"
          
          COMMON_OPTS="--cookies ../cookies.txt \
            --no-check-formats \
            --extractor-args youtube:player_client=web,android,ios \
            --extractor-args youtube:skip=webpage \
            --extractor-retries 5 \
            --retries 20 \
            --fragment-retries 20 \
            --sleep-interval 4 \
            --sleep-subtitles 2 \
            --no-warnings \
            --ignore-errors \
            --no-playlist \
            --compat-options no-external-downloader-progress"

          # ============= یوتیوب =============
          if [ "${{ github.event.inputs.platform }}" = "youtube" ]; then
            if [ "${{ github.event.inputs.type }}" = "video" ]; then
              # دانلود بهترین فرمت کامل موجود (با گزینه‌های تضمین‌شده)
              yt-dlp $COMMON_OPTS -f "best" \
                "${{ github.event.inputs.url }}" -o "%(title)s.%(ext)s"
            else
              # دانلود صوتی با بهترین کیفیت ممکن
              yt-dlp $COMMON_OPTS -f "bestaudio/best" -x --audio-format mp3 --audio-quality 0 \
                "${{ github.event.inputs.url }}" -o "%(title)s.%(ext)s"
            fi

          # ============= ساندکلاد =============
          else
            if [ "${{ github.event.inputs.type }}" = "video" ]; then
              yt-dlp $COMMON_OPTS -f "best" \
                "${{ github.event.inputs.url }}" -o "%(title)s.%(ext)s"
            else
              yt-dlp $COMMON_OPTS -f "bestaudio/best" -x --audio-format mp3 --audio-quality 0 \
                "${{ github.event.inputs.url }}" -o "%(title)s.%(ext)s"
            fi
          fi
         
          DOWNLOADED_FILE=$(ls -1 | head -1)
          if [ -z "$DOWNLOADED_FILE" ]; then
            echo "❌ هیچ فایلی دانلود نشد!"
            ls -la
            exit 1
          fi
          echo "DOWNLOADED_FILE=$DOWNLOADED_FILE" >> $GITHUB_ENV
          echo "✅ دانلود با موفقیت انجام شد - فایل: $DOWNLOADED_FILE"

      - name: ✂️ Split into zip volumes (if requested)
        if: github.event.inputs.split_choice == 'split'
        run: |
          cd "${{ github.event.inputs.folder }}"
          FILE="${{ env.DOWNLOADED_FILE }}"
          SIZE="${{ github.event.inputs.split_size }}"
          sudo apt-get update && sudo apt-get install -y zip
          echo "Creating zip volumes of $SIZE from $FILE"
          zip -s "$SIZE" "${FILE}.zip" "$FILE"
          rm "$FILE"
          echo "✅ Zip volumes created:"
          ls -la

      - name: ☁️ آپلود به Mega.nz
        run: |
          CONFIG_FILE="$HOME/.config/rclone/rclone.conf"
          REMOTE_PATH="mega:${{ github.event.inputs.mega_folder }}"
          
          echo "📁 محتویات پوشه محلی '${{ github.event.inputs.folder }}':"
          ls -la "${{ github.event.inputs.folder }}"
          
          echo "🟢 بررسی وجود فایل rclone:"
          ls -la ~/bin/rclone
          ~/bin/rclone version || { echo "⚠️ rclone قابل اجرا نیست"; exit 1; }
          
          echo "🔄 تست اتصال به Mega:"
          ~/bin/rclone --config "$CONFIG_FILE" lsd mega: || { echo "❌ اتصال به مگا برقرار نیست"; exit 1; }
          
          echo "📂 ایجاد پوشه در مگا: $REMOTE_PATH"
          ~/bin/rclone --config "$CONFIG_FILE" mkdir "$REMOTE_PATH" 2>&1
          
          echo "☁️ شروع آپلود..."
          ~/bin/rclone --config "$CONFIG_FILE" copy "${{ github.event.inputs.folder }}" "$REMOTE_PATH" \
            --progress --transfers=4 -vv
          
          echo "🔍 لیست نهایی فایل‌ها در مگا:"
          ~/bin/rclone --config "$CONFIG_FILE" ls "$REMOTE_PATH"
