name: 📸 دریافت پست‌های اینستاگرام (و ایجاد Issue)

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'نام کاربری پیج (بدون @)'
        required: true
        default: 'bbcpersian'
      post_count:
        description: 'تعداد پست'
        required: true
        default: '5'
        type: choice
        options:
          - '5'
          - '10'
          - '15'
          - '20'

jobs:
  fetch-and-create-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: 📥 دریافت کد مخزن
        uses: actions/checkout@v4

      - name: 🐍 تنظیم پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 نصب کتابخانه Apify client
        run: pip install apify-client

      - name: 📦 نصب کتابخانه requests (برای ایجاد Issue)
        run: pip install requests

      - name: 🚀 دریافت پست‌ها با Apify
        env:
          TARGET_USERNAME: ${{ github.event.inputs.username }}
          POST_COUNT: ${{ github.event.inputs.post_count }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python .github/scripts/fetch_instagram_apify.py

      - name: 🗂️ ذخیره فایل instagram_posts.json در مخزن
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram_posts.json
          git diff --staged --quiet || git commit -m "📸 به‌روزرسانی پست‌های @${{ github.event.inputs.username }}"
          git push

      - name: 📝 ایجاد Issue با لیست پست‌ها
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python .github/scripts/create_issue_with_posts.py
