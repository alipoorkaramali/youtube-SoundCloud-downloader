name: 📸 اینستاگرام | دریافت ۵ پست آخر (با لاگین مستقیم)

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'نام کاربری پیج مقصد (بدون @)'
        required: true
        default: 'bbcpersian'
      output_file:
        description: 'نام فایل JSON خروجی'
        required: false
        default: 'instagram_posts.json'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install instaloader
        run: pip install instaloader
      - name: Fetch posts
        env:
          TARGET_USERNAME: ${{ github.event.inputs.username }}
          OUTPUT_FILE: ${{ github.event.inputs.output_file }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: python .github/scripts/fetch_instagram_login.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.output_file }}"
          git diff --staged --quiet || git commit -m "📸 پست‌های @${{ github.event.inputs.username }}"
          git push
