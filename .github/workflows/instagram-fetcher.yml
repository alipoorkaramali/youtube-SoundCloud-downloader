name: 📸 دریافت پست‌های اینستاگرام (تعداد انتخابی 5،10،15،20)

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'نام کاربری پیج عمومی (بدون @)'
        required: true
        default: 'bbcpersian'
      post_count:
        description: 'تعداد پست مورد نظر'
        required: true
        default: '5'
        type: choice
        options:
          - '5'
          - '10'
          - '15'
          - '20'
      output_file:
        description: 'نام فایل JSON خروجی'
        required: false
        default: 'instagram_posts.json'

jobs:
  fetch-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 دریافت کد مخزن
        uses: actions/checkout@v4

      - name: 🐍 نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 نصب کتابخانه Apify
        run: pip install apify-client

      - name: 🚀 اجرای اسکریپت دریافت پست‌ها
        env:
          TARGET_USERNAME: ${{ github.event.inputs.username }}
          POST_COUNT: ${{ github.event.inputs.post_count }}
          OUTPUT_FILE: ${{ github.event.inputs.output_file }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python .github/scripts/fetch_instagram_apify.py

      - name: 💾 ذخیره خروجی در مخزن
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.output_file }}"
          git diff --staged --quiet || git commit -m "📸 به‌روزرسانی ${{ github.event.inputs.post_count }} پست از @${{ github.event.inputs.username }}"
          git push
