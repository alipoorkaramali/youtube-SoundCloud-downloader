name: 📸 اینستاگرام | دریافت ۵ پست آخر (پایدار با کوکی)

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'نام کاربری پیج عمومی (بدون @)'
        required: true
        default: 'bbcpersian'
      output_file:
        description: 'نام فایل JSON خروجی'
        required: false
        default: 'instagram_posts.json'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 دریافت مخزن
        uses: actions/checkout@v4

      - name: 🐍 نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 نصب پیش‌نیازها
        run: |
          pip install instaloader requests
          sudo apt-get update && sudo apt-get install -y gpg

      - name: 📸 دریافت پست‌ها
        env:
          IG_USERNAME: ${{ github.event.inputs.username }}
          OUTPUT_FILE: ${{ github.event.inputs.output_file }}
          INSTAGRAM_COOKIE_PASSPHRASE: ${{ secrets.INSTAGRAM_COOKIE_PASSPHRASE }}
        run: python .github/scripts/fetch_instagram_advanced.py

      - name: 💾 ذخیره خروجی در مخزن
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.output_file }}"
          git diff --staged --quiet || git commit -m "📸 به‌روزرسانی پست‌های @${{ github.event.inputs.username }}"
          git push
