name: 📸 دریافت پست‌های اینستاگرام (ذخیره فایل جدید)

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'نام کاربری پیج (بدون @)'
        required: true
        default: 'bbcpersian'
      post_count:
        description: 'تعداد پست'
        required: true
        default: '5'
        type: choice
        options:
          - '5'
          - '10'
          - '15'
          - '20'

jobs:
  fetch-and-create-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: 📥 دریافت کد مخزن
        uses: actions/checkout@v4

      - name: 🐍 تنظیم پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 نصب کتابخانه‌ها
        run: |
          pip install apify-client
          pip install requests

      - name: 🚀 دریافت پست‌ها با Apify (Round Robin)
        env:
          TARGET_USERNAME: ${{ github.event.inputs.username }}
          POST_COUNT: ${{ github.event.inputs.post_count }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_API_TOKEN_2: ${{ secrets.APIFY_API_TOKEN_2 }}
        run: python .github/scripts/fetch_instagram_apify.py

      # ========== ذخیره فایل JSON جدید به همراه timestamp ==========
      - name: 📁 ایجاد پوشه instagram_data
        run: mkdir -p instagram_data

      - name: 💾 ذخیره JSON جدید بدون حذف قبلی
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          USERNAME="${{ github.event.inputs.username }}"
          NEW_FILE="instagram_data/${USERNAME}_${TIMESTAMP}.json"
          if [ -f instagram_posts.json ]; then
            cp instagram_posts.json "$NEW_FILE"
            echo "✅ فایل جدید ذخیره شد: $NEW_FILE"
          else
            echo "❌ فایل instagram_posts.json یافت نشد"
            exit 1
          fi

      # ========== به‌روزرسانی لینک نمادین (اختیاری) ==========
      - name: 🔗 بروزرسانی لینک symlink به آخرین فایل
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          ln -sf "instagram_data/${USERNAME}_$(date +%Y%m%d_%H%M%S).json" "instagram_posts.json" 2>/dev/null || true

      # ========== ادامه مراحل قبلی (بستن ایشوها و ایجاد ایشو) ==========
      - name: 🗂️ ذخیره token_counter.txt (در صورت نیاز)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add token_counter.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "🔄 به‌روزرسانی token_counter" && git push

      - name: ❌ بستن ایشوهای قبلی برای همین پیج
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          ISSUE_NUMBERS=$(gh issue list --state open --search "in:title @$USERNAME" --json number --jq '.[].number')
          for num in $ISSUE_NUMBERS; do
            gh issue close "$num" --comment "این ایشو با درخواست جدید به‌روزرسانی شده و بسته می‌شود."
          done

      - name: 📝 ایجاد Issue با لیست پست‌ها (از آخرین فایل)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python .github/scripts/create_issue_with_posts.py
