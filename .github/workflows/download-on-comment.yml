name: 📥 اینستاگرام + آپلود به مگا با rclone

on:
  issue_comment:
    types: [created]

jobs:
  download-and-upload:
    if: contains(github.event.comment.body, '/download')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: 📥 Checkout مخزن
        uses: actions/checkout@v4

      - name: 🔢 استخراج شماره پست
        id: extract
        run: |
          COMMENT="${{ github.event.comment.body }}"
          NUMBER=$(echo "$COMMENT" | grep -oE '/download[[:space:]]+([0-9]+)' | grep -oE '[0-9]+')
          if [ -z "$NUMBER" ]; then
            echo "No number found"
            exit 1
          fi
          echo "post_number=$NUMBER" >> $GITHUB_OUTPUT

      - name: 🐍 نصب Python و پیش‌نیازها
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ نصب yt-dlp و requests
        run: pip install yt-dlp requests

      - name: 🔄 بازیابی کش (فقط محتوای دانلود شده)
        id: cache
        uses: actions/cache@v4
        with:
          path: instagram_downloads
          key: instagram-post-${{ steps.extract.outputs.post_number }}

      - name: 🎯 دانلود پست (در صورت عدم کش)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          POST_INDEX: ${{ steps.extract.outputs.post_number }}
        run: python .github/scripts/download_instagram_by_index.py

      - name: 💾 ذخیره در کش (برای دفعات بعد)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: instagram_downloads
          key: instagram-post-${{ steps.extract.outputs.post_number }}

      # ---------- نصب rclone بدون مشکل کش (روش مطمئن) ----------
      - name: 📦 نصب rclone (آخرین نسخه)
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: 🔓 رمزگشایی کانفیگ rclone برای مگا
        run: |
          mkdir -p ~/.config/rclone
          if [ ! -f rclone_mega.conf.gpg ]; then
            echo "❌ فایل rclone_mega.conf.gpg در ریشه مخزن پیدا نشد!"
            exit 1
          fi
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" --output ~/.config/rclone/rclone.conf rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf
          echo "✅ rclone config loaded"
          rclone --config ~/.config/rclone/rclone.conf listremotes

      - name: ☁️ آپلود به مگا با rclone
        id: upload
        run: |
          CONFIG_FILE="$HOME/.config/rclone/rclone.conf"
          REMOTE_PATH="mega:Instagram_Post_${{ steps.extract.outputs.post_number }}"
          LOCAL_DIR="instagram_downloads"
          
          # ایجاد پوشه در مگا
          rclone --config "$CONFIG_FILE" mkdir "$REMOTE_PATH" 2>/dev/null || true
          
          # آپلود محتوا
          rclone --config "$CONFIG_FILE" copy "$LOCAL_DIR" "$REMOTE_PATH" --progress --transfers=4 --verbose
          
          # گرفتن لینک عمومی (rclone خودش می‌تواند برای پوشه لینک بسازد)
          # توجه: برخی ریموت‌ها نیاز به پشتیبانی دارند، مگا پشتیبانی می‌کند.
          LINK=$(rclone --config "$CONFIG_FILE" link "$REMOTE_PATH" 2>/dev/null)
          if [ -z "$LINK" ]; then
            # اگر لینک پوشه کار نکرد، لینک اولین فایل را می‌گیریم
            FIRST_FILE=$(rclone --config "$CONFIG_FILE" ls "$REMOTE_PATH" | head -1 | awk '{print $2}')
            if [ -n "$FIRST_FILE" ]; then
              LINK=$(rclone --config "$CONFIG_FILE" link "$REMOTE_PATH/$FIRST_FILE")
            fi
          fi
          
          echo "mega_link=$LINK" >> $GITHUB_OUTPUT
          echo "✅ آپلود کامل شد. لینک: $LINK"

      - name: 💬 کامنت موفقیت با لینک مگا
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=$(mktemp)
          echo "✅ پست شماره ${{ steps.extract.outputs.post_number }} با موفقیت به مگا آپلود شد." >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "🔗 **لینک دانلود:** ${{ steps.upload.outputs.mega_link }}" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "⚡ (این فایل از روی کش بازیابی شد، دانلود جدید انجام نشد.)" >> "$BODY_FILE"
          else
            echo "📥 (این فایل به تازگی دانلود و آپلود شده است.)" >> "$BODY_FILE"
          fi
          gh issue comment "${{ github.event.issue.number }}" --body-file "$BODY_FILE"

      - name: ❌ کامنت خطا
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "❌ خطا در پردازش پست شماره ${{ steps.extract.outputs.post_number }}. لطفاً لاگ اکشن را بررسی کنید."
