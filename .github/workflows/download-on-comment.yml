name: 📥 دانلود اینستاگرام / تیک‌تاک و آپلود به مگا

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      url_or_shortcode:
        description: 'لینک اینستاگرام / تیک‌تاک یا shortcode اینستاگرام'
        required: true
        type: string
      mega_folder:
        description: 'پوشه مقصد در مگا (پیش‌فرض: Instagram یا TikTok)'
        required: false
        type: string
        default: ''

jobs:
  download:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/download'))
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: استخراج پلتفرم و شناسه
        id: parse
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_INPUT='${{ github.event.inputs.url_or_shortcode }}'
          else
            RAW_INPUT='${{ github.event.comment.body }}'
          fi

          # تمیز کردن
          RAW_INPUT=$(echo "$RAW_INPUT" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          echo "📥 ورودی خام: [$RAW_INPUT]"

          PLATFORM=""
          ID=""
          FULL_URL=""

          # ========== تیک‌تاک ==========
          if echo "$RAW_INPUT" | grep -qiE 'tiktok\.com|vt\.tiktok\.com|vm\.tiktok\.com'; then
            PLATFORM="tiktok"

            FULL_URL=$(echo "$RAW_INPUT" | grep -oE 'https?://[^[:space:]"'\''<>]+' | grep -i tiktok | head -1)

            if [ -z "$FULL_URL" ] && echo "$RAW_INPUT" | grep -qE '^https?://'; then
              FULL_URL="$RAW_INPUT"
            fi

            ID=$(echo "$FULL_URL" | grep -oE '/video/[0-9]+' | head -1 | sed 's|/video/||')
            if [ -z "$ID" ]; then
              ID=$(echo "$FULL_URL" | grep -oE '[0-9]{15,}' | head -1)
            fi
            if [ -z "$ID" ]; then
              ID="tiktok_$(date +%s)"
            fi

          # ========== اینستاگرام ==========
          elif echo "$RAW_INPUT" | grep -qiE 'instagram\.com'; then
            PLATFORM="instagram"

            FULL_URL=$(echo "$RAW_INPUT" | grep -oE 'https?://[^[:space:]"'\''<>]+' | grep -i instagram | head -1)
            if [ -z "$FULL_URL" ] && echo "$RAW_INPUT" | grep -qE '^https?://'; then
              FULL_URL="$RAW_INPUT"
            fi

            ID=$(echo "$RAW_INPUT" | grep -oE '/(p|reel|tv)/[A-Za-z0-9_-]+' | head -1 | awk -F'/' '{print $3}')
            if [ -z "$ID" ]; then
              ID=$(echo "$RAW_INPUT" | grep -oE '/download[[:space:]]+([A-Za-z0-9_-]+)' | awk '{print $2}')
            fi

          # ========== shortcode خام ==========
          else
            PLATFORM="instagram"
            ID=$(echo "$RAW_INPUT" | grep -oE '/download[[:space:]]+([A-Za-z0-9_-]+)' | awk '{print $2}')
            if [ -z "$ID" ]; then
              ID=$(echo "$RAW_INPUT" | grep -oE '[A-Za-z0-9_-]{5,}' | head -1)
            fi
            if [ -n "$ID" ]; then
              FULL_URL="https://www.instagram.com/p/${ID}/"
            fi
          fi

          if [ -z "$PLATFORM" ] || [ -z "$ID" ] || [ -z "$FULL_URL" ]; then
            echo "❌ نتوانست پلتفرم/لینک را استخراج کند"
            echo "PLATFORM=[$PLATFORM] ID=[$ID] FULL_URL=[$FULL_URL]"
            exit 1
          fi

          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "full_url=$FULL_URL" >> $GITHUB_OUTPUT

          echo "✅ پلتفرم: $PLATFORM"
          echo "✅ شناسه: $ID"
          echo "✅ URL: $FULL_URL"

      - name: 🔐 رمزگشایی کوکی اینستاگرام (فقط در صورت نیاز)
        if: steps.parse.outputs.platform == 'instagram'
        run: |
          if [ ! -f config/INSTAGRAM_COOKIES.gpg ]; then
            echo "⚠️ کوکی اینستاگرام موجود نیست — بدون کوکی ادامه می‌دهیم"
            exit 0
          fi
          gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" --decrypt config/INSTAGRAM_COOKIES.gpg > cookies.txt || true
          if [ -s cookies.txt ]; then
            echo "✅ کوکی رمزگشایی شد"
            echo "INSTAGRAM_COOKIES_PATH=$(pwd)/cookies.txt" >> $GITHUB_ENV
          fi

      - name: نصب ابزارها
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip jq
          pip3 install --upgrade yt-dlp
          echo "--- versions ---"
          yt-dlp --version
          ffmpeg -version | head -1

      - name: دانلود محتوا با yt-dlp
        id: download
        env:
          PLATFORM: ${{ steps.parse.outputs.platform }}
          ITEM_ID: ${{ steps.parse.outputs.id }}
          FULL_URL: ${{ steps.parse.outputs.full_url }}
        run: |
          set -e
          echo "========================================"
          echo "پلتفرم : $PLATFORM"
          echo "شناسه  : $ITEM_ID"
          echo "URL    : $FULL_URL"
          echo "========================================"

          if [ -z "$FULL_URL" ]; then
            echo "❌ FULL_URL خالی است!"
            exit 1
          fi

          DOWNLOAD_DIR="${PLATFORM}_downloads/${ITEM_ID}"
          mkdir -p "$DOWNLOAD_DIR"

          COOKIE_ARGS=""
          if [ "$PLATFORM" = "instagram" ] && [ -n "$INSTAGRAM_COOKIES_PATH" ] && [ -f "$INSTAGRAM_COOKIES_PATH" ]; then
            COOKIE_ARGS="--cookies $INSTAGRAM_COOKIES_PATH"
            echo "🍪 از کوکی اینستاگرام استفاده می‌شود"
          fi

          echo "▶️ شروع دانلود..."

          # اول سعی می‌کنیم با بهترین کیفیت
          set +e
          yt-dlp \
            --no-playlist \
            --retries 10 \
            --fragment-retries 10 \
            --merge-output-format mp4 \
            -o "${DOWNLOAD_DIR}/%(uploader)s - %(title)s [%(id)s].%(ext)s" \
            $COOKIE_ARGS \
            "$FULL_URL" 2>&1 | tee /tmp/ytdlp.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ yt-dlp با کد $EXIT_CODE شکست خورد"
            echo "--- آخرین خطوط لاگ ---"
            tail -50 /tmp/ytdlp.log || true
            echo ""
            echo "محتوای پوشه:"
            ls -la "$DOWNLOAD_DIR" || true
            exit 1
          fi

          # چک کردن که فایل واقعاً دانلود شده
          FILE_COUNT=$(find "$DOWNLOAD_DIR" -type f ! -name '*.json' ! -name '*.txt' | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ هیچ فایلی دانلود نشد!"
            ls -la "$DOWNLOAD_DIR"
            exit 1
          fi

          echo "✅ دانلود موفق — تعداد فایل: $FILE_COUNT"
          ls -lh "$DOWNLOAD_DIR"

          # متادیتا ساده
          USERNAME=$(yt-dlp --print "%(uploader)s" --no-download "$FULL_URL" 2>/dev/null || echo "unknown")
          [ -z "$USERNAME" ] && USERNAME="unknown"

          cat > "$DOWNLOAD_DIR/post_info.json" << JSON
          {
            "id": "$ITEM_ID",
            "username": "$USERNAME",
            "platform": "$PLATFORM"
          }
          JSON

          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "👤 Username: $USERNAME"

      - name: Cache rclone
        id: cache-rclone
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/rclone
          key: rclone-${{ runner.os }}

      - name: Install rclone (if not cached)
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.local/bin
          cp /usr/bin/rclone ~/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Enable rclone (cached)
        if: steps.cache-rclone.outputs.cache-hit == 'true'
        run: |
          chmod +x ~/.local/bin/rclone
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Decrypt rclone config
        run: |
          mkdir -p ~/.config/rclone
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" \
              --output ~/.config/rclone/rclone.conf config/rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Upload to Mega
        id: mega
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          PLATFORM="${{ steps.parse.outputs.platform }}"
          ID="${{ steps.parse.outputs.id }}"
          USERNAME="${{ steps.download.outputs.username }}"
          [ -z "$USERNAME" ] && USERNAME="unknown"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.mega_folder }}" ]; then
            MEGA_FOLDER="${{ github.event.inputs.mega_folder }}"
          else
            if [ "$PLATFORM" = "tiktok" ]; then
              MEGA_FOLDER="TikTok"
            else
              MEGA_FOLDER="Instagram"
            fi
          fi

          MEGA_FOLDER=$(echo "$MEGA_FOLDER" | sed 's|^/*||;s|/*$||')
          [ -z "$MEGA_FOLDER" ] && MEGA_FOLDER="TikTok"

          echo "mega_folder=$MEGA_FOLDER" >> $GITHUB_OUTPUT
          echo "📁 پوشه مگا: $MEGA_FOLDER (پلتفرم: $PLATFORM)"

          REMOTE="mega:${MEGA_FOLDER}/${USERNAME}/${ID}"
          echo "📤 آپلود به: $REMOTE"

          rclone mkdir "$REMOTE" 2>/dev/null || true
          rclone copy "${PLATFORM}_downloads/${ID}" "$REMOTE" --transfers=4

          sudo apt-get update -qq && sudo apt-get install -y -qq megatools || true
          LINK=$(megatools export --username "$MEGA_EMAIL" --password "$MEGA_PASSWORD" "/${MEGA_FOLDER}/${USERNAME}/${ID}" 2>/dev/null | grep -o 'https://mega.nz/[^ ]*' | head -1 || true)
          echo "link=$LINK" >> $GITHUB_OUTPUT

      - name: Comment success
        if: success() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLATFORM="${{ steps.parse.outputs.platform }}"
          BODY=$(mktemp)
          echo "✅ **${PLATFORM^}** با موفقیت دانلود و به مگا آپلود شد." >> $BODY
          echo "" >> $BODY
          echo "🆔 شناسه: \`${{ steps.parse.outputs.id }}\`" >> $BODY
          echo "👤 کاربر: \`${{ steps.download.outputs.username }}\`" >> $BODY
          echo "📁 مسیر: \`${{ steps.mega.outputs.mega_folder }}/${{ steps.download.outputs.username }}/${{ steps.parse.outputs.id }}/\`" >> $BODY
          if [ -n "${{ steps.mega.outputs.link }}" ]; then
            echo "🔗 لینک مگا: ${{ steps.mega.outputs.link }}" >> $BODY
          fi
          gh issue comment "${{ github.event.issue.number }}" --body-file $BODY

      - name: Comment error
        if: failure() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "❌ خطا در دانلود \`${{ steps.parse.outputs.platform }}\` (شناسه: ${{ steps.parse.outputs.id }}). لطفاً لاگ را بررسی کنید."
