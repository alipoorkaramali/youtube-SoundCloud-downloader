name: 📥 دانلود اینستاگرام / تیک‌تاک و آپلود به مگا

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      url_or_shortcode:
        description: 'لینک اینستاگرام / تیک‌تاک یا shortcode اینستاگرام'
        required: true
        type: string
      mega_folder:
        description: 'پوشه مقصد در مگا (پیش‌فرض: Instagram یا TikTok)'
        required: false
        type: string
        default: ''

jobs:
  download:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/download'))
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: استخراج پلتفرم و شناسه
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_INPUT="${{ github.event.inputs.url_or_shortcode }}"
          else
            RAW_INPUT="${{ github.event.comment.body }}"
          fi

          # تمیز کردن ورودی
          RAW_INPUT=$(echo "$RAW_INPUT" | tr -d '\r' | xargs)

          PLATFORM=""
          ID=""
          FULL_URL=""

          echo "📥 ورودی خام: $RAW_INPUT"

          # ========== تشخیص تیک‌تاک ==========
          if echo "$RAW_INPUT" | grep -qiE 'tiktok\.com|vt\.tiktok\.com|vm\.tiktok\.com'; then
            PLATFORM="tiktok"

            # استخراج هر لینک تیک‌تاک از متن
            FULL_URL=$(echo "$RAW_INPUT" | grep -oE 'https?://[^[:space:]]*tiktok[^[:space:]]*' | head -1)

            # اگر پیدا نشد، شاید فقط /download لینک باشد
            if [ -z "$FULL_URL" ]; then
              FULL_URL=$(echo "$RAW_INPUT" | grep -oE '/download[[:space:]]+(https?://[^[:space:]]+)' | awk '{print $2}')
            fi

            # اگر هنوز خالی است و کل ورودی یک URL است
            if [ -z "$FULL_URL" ] && echo "$RAW_INPUT" | grep -qE '^https?://'; then
              FULL_URL="$RAW_INPUT"
            fi

            # استخراج video id
            ID=$(echo "$FULL_URL" | grep -oE '/video/([0-9]+)' | head -1 | sed 's|/video/||')
            if [ -z "$ID" ]; then
              ID=$(echo "$FULL_URL" | grep -oE '[0-9]{15,}' | head -1)
            fi
            if [ -z "$ID" ]; then
              ID="tiktok_$(date +%s)"
            fi

          # ========== تشخیص اینستاگرام ==========
          elif echo "$RAW_INPUT" | grep -qiE 'instagram\.com'; then
            PLATFORM="instagram"

            FULL_URL=$(echo "$RAW_INPUT" | grep -oE 'https?://[^[:space:]]*instagram[^[:space:]]*' | head -1)
            if [ -z "$FULL_URL" ] && echo "$RAW_INPUT" | grep -qE '^https?://'; then
              FULL_URL="$RAW_INPUT"
            fi

            ID=$(echo "$RAW_INPUT" | grep -oE '/(p|reel|tv)/[A-Za-z0-9_-]+' | head -1 | awk -F'/' '{print $3}')
            if [ -z "$ID" ]; then
              ID=$(echo "$RAW_INPUT" | grep -oE '/download[[:space:]]+([A-Za-z0-9_-]+)' | awk '{print $2}')
            fi

          # ========== shortcode خام (فرض اینستاگرام) ==========
          else
            PLATFORM="instagram"
            ID=$(echo "$RAW_INPUT" | grep -oE '/download[[:space:]]+([A-Za-z0-9_-]+)' | awk '{print $2}')
            if [ -z "$ID" ]; then
              ID=$(echo "$RAW_INPUT" | grep -oE '[A-Za-z0-9_-]{5,}' | head -1)
            fi
            if [ -n "$ID" ]; then
              FULL_URL="https://www.instagram.com/p/${ID}/"
            fi
          fi

          # اعتبارسنجی نهایی
          if [ -z "$PLATFORM" ] || [ -z "$ID" ]; then
            echo "❌ فرمت صحیح نیست."
            echo "نمونه‌های صحیح:"
            echo "  /download https://www.tiktok.com/@user/video/1234567890"
            echo "  /download https://www.instagram.com/reel/XXXXX/"
            echo "  /download SHORTCODE"
            exit 1
          fi

          if [ -z "$FULL_URL" ]; then
            echo "❌ لینک کامل استخراج نشد!"
            exit 1
          fi

          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "full_url=$FULL_URL" >> $GITHUB_OUTPUT
          echo "✅ پلتفرم: $PLATFORM | شناسه: $ID"
          echo "🔗 URL نهایی: $FULL_URL"

      - name: 🔐 رمزگشایی کوکی اینستاگرام (فقط در صورت نیاز)
        if: steps.parse.outputs.platform == 'instagram'
        run: |
          if [ ! -f config/INSTAGRAM_COOKIES.gpg ]; then
            echo "⚠️ فایل INSTAGRAM_COOKIES.gpg یافت نشد. بدون کوکی ادامه می‌دهیم."
            exit 0
          fi
          gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" --decrypt config/INSTAGRAM_COOKIES.gpg > cookies.txt
          if [ -s cookies.txt ]; then
            echo "✅ کوکی اینستاگرام رمزگشایی شد"
            echo "INSTAGRAM_COOKIES_PATH=$(pwd)/cookies.txt" >> $GITHUB_ENV
          else
            echo "⚠️ کوکی خالی بود"
          fi

      - name: نصب Python و yt-dlp + ffmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install --upgrade yt-dlp requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          yt-dlp --version
          ffmpeg -version | head -1

      - name: ایجاد اسکریپت دانلود چندپلتفرمی
        run: |
          mkdir -p .github/scripts
          cat > .github/scripts/download_multi.py << 'EOF'
          #!/usr/bin/env python3
          import os, sys, json, subprocess
          from pathlib import Path

          def download_with_ytdlp(url, output_dir, cookies_file=None):
              cmd = [
                  "yt-dlp",
                  "--no-playlist",
                  "-o", f"{output_dir}/%(uploader)s - %(title)s [%(id)s].%(ext)s",
                  "--merge-output-format", "mp4",
                  "--retries", "15",
                  "--fragment-retries", "15",
                  "--no-warnings",
                  url
              ]
              if cookies_file and Path(cookies_file).exists():
                  cmd.extend(["--cookies", cookies_file])

              print(f"▶️ در حال دانلود: {url}")
              print(f"📂 پوشه خروجی: {output_dir}")
              try:
                  result = subprocess.run(cmd, check=True, capture_output=True, text=True)
                  if result.stdout:
                      print(result.stdout[-800:])
                  return True
              except subprocess.CalledProcessError as e:
                  print(f"❌ yt-dlp خطا (exit {e.returncode}):")
                  print(e.stderr[-1500:] if e.stderr else "(بدون stderr)")
                  if e.stdout:
                      print("stdout:", e.stdout[-500:])
                  return False

          def extract_metadata(url, cookies_file=None):
              cmd = ["yt-dlp", "--dump-json", "--no-playlist", url]
              if cookies_file and Path(cookies_file).exists():
                  cmd.extend(["--cookies", cookies_file])
              try:
                  result = subprocess.run(cmd, capture_output=True, text=True, check=True, timeout=60)
                  info = json.loads(result.stdout)
                  return {
                      "id": info.get("id"),
                      "username": info.get("uploader") or info.get("channel") or info.get("creator") or "unknown",
                      "title": info.get("title", ""),
                      "description": info.get("description", ""),
                      "like_count": info.get("like_count", 0),
                      "view_count": info.get("view_count", 0),
                  }
              except Exception as e:
                  print(f"⚠️ خطا در متادیتا: {e}")
                  return None

          def main():
              if len(sys.argv) < 4:
                  print("Usage: python download_multi.py <platform> <id> <url>")
                  sys.exit(1)

              platform = sys.argv[1]
              item_id = sys.argv[2]
              url = sys.argv[3]

              if not url or url.strip() == "":
                  print("❌ URL خالی است!")
                  sys.exit(1)

              download_dir = Path(f"{platform}_downloads") / item_id
              download_dir.mkdir(parents=True, exist_ok=True)

              cookies = os.environ.get("INSTAGRAM_COOKIES_PATH") if platform == "instagram" else None

              success = download_with_ytdlp(url, str(download_dir), cookies)

              if not success and platform == "instagram" and cookies:
                  print("🔄 تلاش مجدد بدون کوکی...")
                  success = download_with_ytdlp(url, str(download_dir))

              if success:
                  metadata = extract_metadata(url, cookies) or {
                      "id": item_id,
                      "username": "unknown",
                      "title": "",
                      "description": ""
                  }
                  with open(download_dir / "metadata.json", "w", encoding="utf-8") as f:
                      json.dump(metadata, f, indent=2, ensure_ascii=False)
                  with open(download_dir / "post_info.json", "w", encoding="utf-8") as f:
                      json.dump({
                          "id": item_id,
                          "username": metadata.get("username", "unknown"),
                          "platform": platform
                      }, f, indent=2)
                  print(f"🎉 دانلود موفق: {platform} | {item_id}")
                  print(f"👤 Username: {metadata.get('username')}")
              else:
                  print(f"💥 دانلود ناموفق: {platform} | {item_id}")
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF
          chmod +x .github/scripts/download_multi.py

      - name: دانلود محتوا
        run: |
          echo "========================================"
          echo "پلتفرم: ${{ steps.parse.outputs.platform }}"
          echo "شناسه: ${{ steps.parse.outputs.id }}"
          echo "URL: ${{ steps.parse.outputs.full_url }}"
          echo "========================================"
          python .github/scripts/download_multi.py \
            "${{ steps.parse.outputs.platform }}" \
            "${{ steps.parse.outputs.id }}" \
            "${{ steps.parse.outputs.full_url }}"

      - name: خواندن نام کاربری
        id: username
        run: |
          PLATFORM="${{ steps.parse.outputs.platform }}"
          ID="${{ steps.parse.outputs.id }}"
          INFO_FILE="${PLATFORM}_downloads/${ID}/post_info.json"
          if [ -f "$INFO_FILE" ]; then
            USERNAME=$(jq -r '.username // "unknown"' "$INFO_FILE")
          else
            USERNAME="unknown"
          fi
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "👤 Username: $USERNAME"

      # ========== rclone ==========
      - name: Cache rclone
        id: cache-rclone
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/rclone
          key: rclone-${{ runner.os }}

      - name: Install rclone (if not cached)
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.local/bin
          cp /usr/bin/rclone ~/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Enable rclone (cached)
        if: steps.cache-rclone.outputs.cache-hit == 'true'
        run: |
          chmod +x ~/.local/bin/rclone
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Decrypt rclone config
        run: |
          mkdir -p ~/.config/rclone
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" \
              --output ~/.config/rclone/rclone.conf config/rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Upload to Mega
        id: mega
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          PLATFORM="${{ steps.parse.outputs.platform }}"
          ID="${{ steps.parse.outputs.id }}"
          USERNAME="${{ steps.username.outputs.username }}"

          # اولویت: ورودی دستی کاربر، در غیر این صورت بر اساس پلتفرم
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.mega_folder }}" ]; then
            MEGA_FOLDER="${{ github.event.inputs.mega_folder }}"
          else
            if [ "$PLATFORM" = "tiktok" ]; then
              MEGA_FOLDER="TikTok"
            else
              MEGA_FOLDER="Instagram"
            fi
          fi

          MEGA_FOLDER=$(echo "$MEGA_FOLDER" | sed 's|^/*||;s|/*$||')
          [ -z "$MEGA_FOLDER" ] && MEGA_FOLDER="TikTok"

          echo "mega_folder=$MEGA_FOLDER" >> $GITHUB_OUTPUT
          echo "📁 پوشه مگا انتخاب‌شده: $MEGA_FOLDER (پلتفرم: $PLATFORM)"

          REMOTE="mega:${MEGA_FOLDER}/${USERNAME}/${ID}"
          echo "📤 آپلود به: $REMOTE"

          rclone mkdir "$REMOTE" 2>/dev/null || true
          rclone copy "${PLATFORM}_downloads/${ID}" "$REMOTE" --transfers=4

          # لینک عمومی (اختیاری)
          sudo apt-get update -qq && sudo apt-get install -y -qq megatools || true
          LINK=$(megatools export --username "$MEGA_EMAIL" --password "$MEGA_PASSWORD" "/${MEGA_FOLDER}/${USERNAME}/${ID}" 2>/dev/null | grep -o 'https://mega.nz/[^ ]*' | head -1 || true)
          echo "link=$LINK" >> $GITHUB_OUTPUT

      - name: Comment success
        if: success() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLATFORM="${{ steps.parse.outputs.platform }}"
          BODY=$(mktemp)
          echo "✅ **${PLATFORM^}** با موفقیت دانلود و به مگا آپلود شد." >> $BODY
          echo "" >> $BODY
          echo "🆔 شناسه: \`${{ steps.parse.outputs.id }}\`" >> $BODY
          echo "👤 کاربر: \`${{ steps.username.outputs.username }}\`" >> $BODY
          echo "📁 مسیر: \`${{ steps.mega.outputs.mega_folder }}/${{ steps.username.outputs.username }}/${{ steps.parse.outputs.id }}/\`" >> $BODY
          if [ -n "${{ steps.mega.outputs.link }}" ]; then
            echo "🔗 لینک مگا: ${{ steps.mega.outputs.link }}" >> $BODY
          fi
          gh issue comment "${{ github.event.issue.number }}" --body-file $BODY

      - name: Comment error
        if: failure() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "❌ خطا در دانلود \`${{ steps.parse.outputs.platform }}\` (شناسه: ${{ steps.parse.outputs.id }}). لطفاً لاگ را بررسی کنید."
