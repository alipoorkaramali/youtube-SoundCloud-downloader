name: 📥 دانلود پست اینستاگرام با shortcode

on:
  issue_comment:
    types: [created]

jobs:
  download:
    if: contains(github.event.comment.body, '/download')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: 📥 Checkout مخزن
        uses: actions/checkout@v4

      - name: 🔢 استخراج shortcode از کامنت
        id: extract
        run: |
          COMMENT="${{ github.event.comment.body }}"
          SHORTCODE=$(echo "$COMMENT" | grep -oE '/download[[:space:]]+([A-Za-z0-9_-]+)' | awk '{print $2}')
          if [ -z "$SHORTCODE" ]; then
            echo "❌ فرمت صحیح نیست. از /download <shortcode> استفاده کنید."
            exit 1
          fi
          echo "shortcode=$SHORTCODE" >> $GITHUB_OUTPUT

      - name: 🐍 نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ نصب yt-dlp و requests
        run: pip install yt-dlp requests

      - name: 🔐 رمزگشایی کوکی (در صورت وجود)
        run: |
          if [ -f cookies.txt.gpg ]; then
            gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" --decrypt cookies.txt.gpg > cookies.txt
            echo "✅ کوکی رمزگشایی شد"
          else
            echo "⚠️ فایل cookies.txt.gpg یافت نشد، دانلود بدون کوکی انجام می‌شود"
            touch cookies.txt
          fi

      # ========== کش فقط برای rclone ==========
      - name: 💾 Cache rclone binary
        id: cache-rclone
        uses: actions/cache@v4
        with:
          path: /usr/bin/rclone
          key: ${{ runner.os }}-rclone-v1.74.0

      - name: 📦 نصب rclone (در صورت عدم کش)
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: 🔓 رمزگشایی کانفیگ rclone برای مگا
        run: |
          mkdir -p ~/.config/rclone
          if [ ! -f rclone_mega.conf.gpg ]; then
            echo "❌ فایل rclone_mega.conf.gpg یافت نشد"
            exit 1
          fi
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" --output ~/.config/rclone/rclone.conf rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf
          rclone --config ~/.config/rclone/rclone.conf listremotes

      # ========== دانلود پست (بدون کش) ==========
      - name: 🎯 دانلود پست
        run: |
          python .github/scripts/download_instagram_by_index.py ${{ steps.extract.outputs.shortcode }}

      # ========== آپلود به مگا ==========
      - name: 📤 آپلود به مگا
        id: mega
        run: |
          SHORTCODE="${{ steps.extract.outputs.shortcode }}"
          INFO_FILE="instagram_downloads/$SHORTCODE/post_info.json"
          if [ -f "$INFO_FILE" ]; then
            USERNAME=$(jq -r '.username' "$INFO_FILE")
          else
            USERNAME="unknown"
          fi
          REMOTE_PATH="mega:Instagram/${USERNAME}/${SHORTCODE}"
          rclone mkdir "$REMOTE_PATH" 2>/dev/null || true
          rclone copy "instagram_downloads/$SHORTCODE" "$REMOTE_PATH" --transfers=4 --verbose
          
          sudo apt-get update
          sudo apt-get install -y megatools jq
          MEGA_FOLDER_PATH="/Instagram/${USERNAME}/${SHORTCODE}"
          LINK=$(megatools export --username "${{ secrets.MEGA_EMAIL }}" --password "${{ secrets.MEGA_PASSWORD }}" "$MEGA_FOLDER_PATH" 2>/dev/null | grep -o 'https://mega.nz/[^ ]*' | head -1)
          if [ -z "$LINK" ]; then
            LINK="⚠️ لینک خودکار گرفته نشد، اما فایل در مگا موجود است."
          fi
          echo "link=$LINK" >> $GITHUB_OUTPUT

      - name: 💬 کامنت موفقیت با لینک مگا
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORTCODE="${{ steps.extract.outputs.shortcode }}"
          LINK="${{ steps.mega.outputs.link }}"
          BODY_FILE=$(mktemp)
          echo "✅ پست با shortcode **\`$SHORTCODE\`** با موفقیت به مگا آپلود شد." >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "🔗 **لینک دانلود:** $LINK" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "📁 ساختار: \`Instagram/username/$SHORTCODE/\`" >> "$BODY_FILE"
          gh issue comment "${{ github.event.issue.number }}" --body-file "$BODY_FILE"

      - name: ❌ کامنت خطا
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "❌ خطا در پردازش shortcode \`${{ steps.extract.outputs.shortcode }}\`. لطفاً لاگ اکشن را بررسی کنید."