name: 📥 دانلود اینستاگرام (سه مرحله‌ای)

on:
  issue_comment:
    types: [created]

jobs:
  download:
    if: contains(github.event.comment.body, '/download')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: استخراج shortcode
        id: sc
        run: |
          COMMENT="${{ github.event.comment.body }}"
          SHORTCODE=$(echo "$COMMENT" | grep -oE '/download[[:space:]]+([A-Za-z0-9_-]+)' | awk '{print $2}')
          if [ -z "$SHORTCODE" ]; then
            echo "❌ فرمت صحیح نیست. از /download <shortcode> استفاده کنید."
            exit 1
          fi
          echo "shortcode=$SHORTCODE" >> $GITHUB_OUTPUT

      - name: نصب Python و کتابخانه‌ها
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install --upgrade yt-dlp requests

      - name: آماده‌سازی کوکی (در صورت وجود)
        run: |
          if [ -n "${{ secrets.INSTAGRAM_COOKIES }}" ]; then
            mkdir -p /tmp/cookies
            printf '%s' "${{ secrets.INSTAGRAM_COOKIES }}" > /tmp/cookies/instagram_cookies.txt
            echo "INSTAGRAM_COOKIES_PATH=/tmp/cookies/instagram_cookies.txt" >> $GITHUB_ENV
            echo "✅ کوکی اینستاگرام بارگذاری شد."
          else
            echo "⚠️ کوکی در دسترس نیست."
          fi

      - name: دانلود با سه مرحله (JSON → yt-dlp بدون کوکی → yt-dlp با کوکی)
        run: python .github/scripts/download_with_fallback.py ${{ steps.sc.outputs.shortcode }}

      - name: خواندن نام کاربری از فایل post_info.json
        id: username
        run: |
          SHORTCODE="${{ steps.sc.outputs.shortcode }}"
          INFO_FILE="instagram_downloads/${SHORTCODE}/post_info.json"
          if [ -f "$INFO_FILE" ]; then
            USERNAME=$(jq -r '.username' "$INFO_FILE")
            echo "username=$USERNAME" >> $GITHUB_OUTPUT
          else
            echo "username=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Commit و Push فایل‌های دانلود شده
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SHORTCODE="${{ steps.sc.outputs.shortcode }}"
          git add "instagram_downloads/${SHORTCODE}"
          if git diff --staged --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            git commit -m "📥 افزودن پست اینستاگرام shortcode: ${SHORTCODE}"
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Push به مخزن
        if: steps.commit.outputs.no_changes == 'false'
        run: |
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin ${{ github.ref_name }}

      - name: ساخت لینک دانلود مستقیم (raw)
        id: filelink
        run: |
          SHORTCODE="${{ steps.sc.outputs.shortcode }}"
          DOWNLOAD_DIR="instagram_downloads/${SHORTCODE}"
          # اولین فایل غیر از post_info.json و info.txt را انتخاب کن
          FILE=$(ls -1 "$DOWNLOAD_DIR" | grep -Ev 'post_info\.json|info\.txt' | head -1)
          if [ -z "$FILE" ]; then
            echo "link=⚠️ فایلی یافت نشد" >> $GITHUB_OUTPUT
          else
            REPO="${{ github.repository }}"
            BRANCH="${{ github.ref_name }}"
            RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/${DOWNLOAD_DIR}/${FILE}"
            echo "link=${RAW_URL}" >> $GITHUB_OUTPUT
          fi

      - name: پاسخ موفقیت در کامنت
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(mktemp)
          echo "✅ پست ${{ steps.sc.outputs.shortcode }} با موفقیت دانلود و به مخزن اضافه شد." >> $BODY
          echo "🔗 لینک فایل: ${{ steps.filelink.outputs.link }}" >> $BODY
          echo "📁 مسیر در مخزن: \`instagram_downloads/${{ steps.username.outputs.username }}/${{ steps.sc.outputs.shortcode }}/\`" >> $BODY
          gh issue comment "${{ github.event.issue.number }}" --body-file $BODY

      - name: پاسخ خطا
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "❌ خطا در shortcode ${{ steps.sc.outputs.shortcode }}. لطفاً لاگ اکشن را بررسی کنید."
