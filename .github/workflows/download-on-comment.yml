name: 📥 دانلود اینستاگرام و آپلود به مگا

on:
  issue_comment:
    types: [created]

jobs:
  download:
    if: contains(github.event.comment.body, '/download')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: استخراج shortcode
        id: sc
        run: |
          COMMENT="${{ github.event.comment.body }}"
          SHORTCODE=$(echo "$COMMENT" | grep -oE '/download[[:space:]]+([A-Za-z0-9_-]+)' | awk '{print $2}')
          if [ -z "$SHORTCODE" ]; then
            echo "❌ فرمت صحیح نیست. از /download <shortcode> استفاده کنید."
            exit 1
          fi
          echo "shortcode=$SHORTCODE" >> $GITHUB_OUTPUT

      - name: 🔐 رمزگشایی کوکی اینستاگرام از فایل INSTAGRAM_COOKIES.gpg
        run: |
          if [ ! -f INSTAGRAM_COOKIES.gpg ]; then
            echo "⚠️ فایل INSTAGRAM_COOKIES.gpg یافت نشد. کوکی در دسترس نیست."
            exit 0
          fi
          gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" --decrypt INSTAGRAM_COOKIES.gpg > cookies.txt
          if [ ! -s cookies.txt ]; then
            echo "❌ رمزگشایی کوکی ناموفق بود یا فایل خالی است"
            exit 1
          fi
          echo "✅ کوکی با موفقیت رمزگشایی شد"
          echo "INSTAGRAM_COOKIES_PATH=$(pwd)/cookies.txt" >> $GITHUB_ENV

      - name: نصب Python و کتابخانه‌ها
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install --upgrade yt-dlp requests

      - name: ایجاد اسکریپت دانلود (سه مرحله‌ای + استخراج متادیتا)
        run: |
          mkdir -p .github/scripts
          cat > .github/scripts/download_with_fallback.py << 'EOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          import os, sys, json, subprocess, requests, zipfile
          from pathlib import Path
          from io import BytesIO
          from datetime import datetime

          def find_post_by_shortcode(shortcode):
              data_dir = Path("instagram_data")
              if not data_dir.exists():
                  return None
              for json_file in data_dir.glob("*.json"):
                  try:
                      with open(json_file, "r", encoding="utf-8") as f:
                          content = f.read()
                          lines = content.split("\n", 1)
                          if len(lines) > 1 and lines[0].strip().isdigit():
                              data = json.loads(lines[1])
                          else:
                              data = json.loads(content)
                      if "recent_posts" in data:
                          for post in data["recent_posts"]:
                              if post.get("shortcode") == shortcode:
                                  return post
                      if data.get("shortcode") == shortcode:
                          return data
                  except:
                      continue
              return None

          def extract_metadata_from_post(post):
              """استخراج فیلدهای مفید از آبجکت پست (JSON اینستاگرام)"""
              metadata = {}
              metadata["shortcode"] = post.get("shortcode")
              metadata["owner_username"] = post.get("owner_username")
              metadata["owner_id"] = post.get("owner_id")
              metadata["caption"] = post.get("caption", "")
              metadata["like_count"] = post.get("like_count", 0)
              metadata["comment_count"] = post.get("comment_count", 0)
              metadata["taken_at"] = post.get("taken_at")
              if metadata["taken_at"]:
                  try:
                      dt = datetime.fromtimestamp(metadata["taken_at"])
                      metadata["taken_at_str"] = dt.strftime("%Y-%m-%d %H:%M:%S")
                  except:
                      pass
              metadata["post_type"] = post.get("post_type")
              metadata["location"] = post.get("location")
              metadata["hashtags"] = post.get("hashtags", [])
              metadata["mentions"] = post.get("mentions", [])
              metadata["media_urls"] = post.get("media_urls", [])
              # فیلدهای اضافی احتمالی
              for extra in ["video_url", "display_url", "thumbnail_url"]:
                  if extra in post:
                      metadata[extra] = post[extra]
              return metadata

          def extract_metadata_from_ytdlp(shortcode, cookies_file=None):
              """اجرای yt-dlp --dump-json و تبدیل به دیکشنری"""
              url = f"https://www.instagram.com/p/{shortcode}/"
              cmd = ["yt-dlp", "--dump-json", "--no-playlist", url]
              if cookies_file and Path(cookies_file).exists():
                  cmd.extend(["--cookies", cookies_file])
              try:
                  result = subprocess.run(cmd, capture_output=True, text=True, check=True)
                  info = json.loads(result.stdout)
                  # نگاشت فیلدهای yt-dlp به ساختار مورد نظر ما
                  metadata = {}
                  metadata["shortcode"] = shortcode
                  metadata["owner_username"] = info.get("uploader")
                  metadata["owner_id"] = info.get("channel_id")
                  metadata["caption"] = info.get("description", "")
                  metadata["like_count"] = info.get("like_count")
                  metadata["comment_count"] = info.get("comment_count")
                  metadata["taken_at"] = info.get("timestamp")
                  if metadata["taken_at"]:
                      try:
                          dt = datetime.fromtimestamp(metadata["taken_at"])
                          metadata["taken_at_str"] = dt.strftime("%Y-%m-%d %H:%M:%S")
                      except:
                          pass
                  metadata["post_type"] = info.get("extractor_key")  # 'Instagram'
                  metadata["location"] = info.get("location")
                  # استخراج هشتگ‌ها و منشن‌ها از کپشن (ساده)
                  caption = metadata["caption"] or ""
                  hashtags = [word for word in caption.split() if word.startswith("#")]
                  mentions = [word for word in caption.split() if word.startswith("@")]
                  metadata["hashtags"] = hashtags
                  metadata["mentions"] = mentions
                  # url رسانه
                  if "entries" in info and info["entries"]:
                      # اگر کاروسل باشد
                      metadata["media_urls"] = [e.get("url") for e in info["entries"] if e.get("url")]
                  else:
                      metadata["media_urls"] = [info.get("url")]
                  return metadata
              except Exception as e:
                  print(f"⚠️ خطا در دریافت متادیتا از yt-dlp: {e}")
                  return None

          def download_media_urls(media_urls, download_dir, shortcode, post_type):
              if not media_urls:
                  return False
              print(f"🖼️ دانلود از media_urls (تعداد: {len(media_urls)})...")
              if len(media_urls) > 1 or post_type == "CAROUSEL_ALBUM":
                  zip_buffer = BytesIO()
                  with zipfile.ZipFile(zip_buffer, 'a', zipfile.ZIP_DEFLATED, False) as zf:
                      for idx, url in enumerate(media_urls, start=1):
                          try:
                              ext = 'jpg' if '.mp4' not in url and 'video' not in url else 'mp4'
                              fname = f"{shortcode}_{idx}.{ext}"
                              resp = requests.get(url, stream=True, timeout=30)
                              resp.raise_for_status()
                              zf.writestr(fname, resp.content)
                              print(f"   ✅ {fname} اضافه شد")
                          except Exception as e:
                              print(f"   ❌ خطا در {url}: {e}")
                  zip_path = download_dir / f"{shortcode}.zip"
                  with open(zip_path, 'wb') as f:
                      f.write(zip_buffer.getvalue())
                  print(f"✅ ZIP ذخیره شد: {zip_path}")
                  return True
              else:
                  url = media_urls[0]
                  ext = 'jpg' if '.mp4' not in url and 'video' not in url else 'mp4'
                  file_path = download_dir / f"{shortcode}.{ext}"
                  try:
                      resp = requests.get(url, stream=True, timeout=30)
                      resp.raise_for_status()
                      with open(file_path, 'wb') as f:
                          for chunk in resp.iter_content(8192):
                              f.write(chunk)
                      print(f"✅ فایل ذخیره شد: {file_path}")
                      return True
                  except Exception as e:
                      print(f"❌ دانلود مستقیم ناموفق: {e}")
                      return False

          def download_ytdlp(shortcode, output_dir, cookies_file=None):
              url = f"https://www.instagram.com/p/{shortcode}/"
              cmd = ["yt-dlp", "--no-playlist", "-o", f"{output_dir}/%(title)s.%(ext)s", url]
              if cookies_file and Path(cookies_file).exists():
                  cmd.extend(["--cookies", cookies_file])
              try:
                  subprocess.run(cmd, check=True, capture_output=True, text=True)
                  return True
              except subprocess.CalledProcessError as e:
                  print(f"❌ yt-dlp خطا: {e.stderr}")
                  return False

          def save_metadata(download_dir, metadata):
              """ذخیره متادیتا در فایل metadata.json (و همچنین post_info.json برای سازگاری)"""
              if not metadata:
                  return
              # ذخیره کامل
              with open(download_dir / "metadata.json", "w", encoding="utf-8") as f:
                  json.dump(metadata, f, indent=2, ensure_ascii=False)
              # ذخیره ساده برای استفاده قبلی
              simple = {
                  "shortcode": metadata.get("shortcode"),
                  "username": metadata.get("owner_username", "unknown")
              }
              with open(download_dir / "post_info.json", "w", encoding="utf-8") as f:
                  json.dump(simple, f, indent=2)

          def main():
              if len(sys.argv) != 2:
                  print("Usage: python download_with_fallback.py <shortcode>")
                  sys.exit(1)
              shortcode = sys.argv[1]
              print(f"🔍 شروع دانلود برای shortcode: {shortcode}")

              # مرحله 1: جستجو در JSON های موجود
              post = find_post_by_shortcode(shortcode)
              metadata = None
              media_urls = []
              username = "unknown"
              post_type = ""

              if post:
                  metadata = extract_metadata_from_post(post)
                  media_urls = metadata.get("media_urls", [])
                  username = metadata.get("owner_username", "unknown")
                  post_type = metadata.get("post_type", "")
                  print(f"📄 پست در JSON یافت شد. owner: {username}, media_urls: {len(media_urls)}")
              else:
                  print("⚠️ پست در فایل‌های JSON یافت نشد. تلاش برای دریافت متادیتا از yt-dlp...")

              download_dir = Path("instagram_downloads") / shortcode
              download_dir.mkdir(parents=True, exist_ok=True)

              success = False
              method = ""

              # دانلود با لینک مستقیم (اگر media_urls موجود باشد)
              if media_urls:
                  if download_media_urls(media_urls, download_dir, shortcode, post_type):
                      success = True
                      method = "media_urls"
                      print("✅ دانلود با لینک مستقیم موفق بود.")

              # مرحله 2: yt-dlp بدون کوکی
              if not success:
                  print("🔄 مرحله ۲: تلاش با yt-dlp (بدون کوکی)...")
                  if download_ytdlp(shortcode, download_dir):
                      success = True
                      method = "yt-dlp_no_cookie"
                      print("✅ دانلود با yt-dlp بدون کوکی موفق بود.")
                      # دریافت متادیتا از yt-dlp
                      if metadata is None:
                          metadata = extract_metadata_from_ytdlp(shortcode)

              # مرحله 3: yt-dlp با کوکی
              if not success:
                  cookies_path = os.environ.get("INSTAGRAM_COOKIES_PATH")
                  if cookies_path and Path(cookies_path).exists():
                      print("🍪 مرحله ۳: تلاش با yt-dlp + کوکی...")
                      if download_ytdlp(shortcode, download_dir, cookies_path):
                          success = True
                          method = "yt-dlp_with_cookie"
                          print("✅ دانلود با yt-dlp و کوکی موفق بود.")
                          if metadata is None:
                              metadata = extract_metadata_from_ytdlp(shortcode, cookies_path)
                  else:
                      print("⚠️ فایل کوکی در دسترس نیست. مرحله ۳ رد شد.")

              # در صورت موفقیت، متادیتا را ذخیره کن
              if success:
                  if metadata is None:
                      # حداقل متادیتا را از اطلاعات موجود بساز
                      metadata = {
                          "shortcode": shortcode,
                          "owner_username": username,
                          "caption": "",
                          "like_count": 0,
                          "comment_count": 0
                      }
                  # اطمینان از وجود username در metadata برای کامنت بعدی
                  if "owner_username" not in metadata or not metadata["owner_username"]:
                      metadata["owner_username"] = username
                  save_metadata(download_dir, metadata)

                  # ذخیره فایل info.txt (گزارش روش دانلود)
                  with open(download_dir / "info.txt", "w", encoding="utf-8") as f:
                      f.write(f"Method: {method}\nShortcode: {shortcode}\nUsername: {metadata.get('owner_username')}\n")
                  print(f"🎉 دانلود نهایی موفق برای {shortcode}")
              else:
                  print(f"💥 همه روش‌ها شکست خوردند: {shortcode}")
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF
          chmod +x .github/scripts/download_with_fallback.py

      - name: دانلود پست (سه مرحله + ذخیره متادیتا)
        run: python .github/scripts/download_with_fallback.py ${{ steps.sc.outputs.shortcode }}

      - name: خواندن نام کاربری از فایل post_info.json
        id: username
        run: |
          SHORTCODE="${{ steps.sc.outputs.shortcode }}"
          INFO_FILE="instagram_downloads/${SHORTCODE}/post_info.json"
          if [ -f "$INFO_FILE" ]; then
            USERNAME=$(jq -r '.username' "$INFO_FILE")
            echo "username=$USERNAME" >> $GITHUB_OUTPUT
          else
            echo "username=unknown" >> $GITHUB_OUTPUT
          fi

      # ========== rclone با پشتیبانی کش ==========
      - name: Cache rclone
        id: cache-rclone
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/rclone
          key: rclone-${{ runner.os }}

      - name: Install rclone (if not cached)
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.local/bin
          cp /usr/bin/rclone ~/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Enable rclone (cached)
        if: steps.cache-rclone.outputs.cache-hit == 'true'
        run: |
          chmod +x ~/.local/bin/rclone
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          rclone version

      - name: Decrypt rclone config
        run: |
          mkdir -p ~/.config/rclone
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" \
              --output ~/.config/rclone/rclone.conf rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Upload to Mega
        id: mega
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          SHORTCODE="${{ steps.sc.outputs.shortcode }}"
          USERNAME="${{ steps.username.outputs.username }}"
          REMOTE="mega:Instagram/${USERNAME}/${SHORTCODE}"
          rclone mkdir "$REMOTE" 2>/dev/null || true
          rclone copy "instagram_downloads/$SHORTCODE" "$REMOTE" --transfers=4
          sudo apt-get update && sudo apt-get install -y megatools
          LINK=$(megatools export --username "$MEGA_EMAIL" --password "$MEGA_PASSWORD" "/Instagram/${USERNAME}/${SHORTCODE}" 2>/dev/null | grep -o 'https://mega.nz/[^ ]*' | head -1)
          echo "link=$LINK" >> $GITHUB_OUTPUT

      - name: Comment success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(mktemp)
          echo "✅ پست ${{ steps.sc.outputs.shortcode }} با موفقیت به مگا آپلود شد." >> $BODY
          echo "🔗 لینک: ${{ steps.mega.outputs.link }}" >> $BODY
          echo "📁 مسیر: \`Instagram/${{ steps.username.outputs.username }}/${{ steps.sc.outputs.shortcode }}/\`" >> $BODY
          gh issue comment "${{ github.event.issue.number }}" --body-file $BODY

      - name: Comment error
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "❌ خطا در shortcode ${{ steps.sc.outputs.shortcode }}. لطفاً لاگ را بررسی کنید."
