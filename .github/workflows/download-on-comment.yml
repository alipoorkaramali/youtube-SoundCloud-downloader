name: 📥 دانلود پست اینستاگرام

on:
  issue_comment:
    types: [created]

jobs:
  download:
    if: contains(github.event.comment.body, '/download')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🔢 استخراج شماره پست
        id: extract
        run: |
          COMMENT="${{ github.event.comment.body }}"
          NUMBER=$(echo "$COMMENT" | grep -oE '/download[[:space:]]+([0-9]+)' | grep -oE '[0-9]+')
          if [ -z "$NUMBER" ]; then
            echo "❌ شماره معتبر نیست"
            exit 1
          fi
          echo "post_number=$NUMBER" >> $GITHUB_OUTPUT

      - name: 🐍 نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 نصب کتابخانه‌ها
        run: pip install yt-dlp requests

      - name: 💾 ذخیره‌سازی rclone (کش)
        id: cache-rclone
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/rclone
          key: ${{ runner.os }}-rclone-v1.74.0

      - name: 📦 نصب rclone (در صورت نیاز)
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.local/bin
          cp /usr/bin/rclone ~/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 🔗 فعال‌سازی rclone
        if: steps.cache-rclone.outputs.cache-hit == 'true'
        run: |
          chmod +x ~/.local/bin/rclone
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          rclone version

      - name: 🔓 باز کردن قفل کانفیگ rclone
        run: |
          mkdir -p ~/.config/rclone
          if [ ! -f rclone_mega.conf.gpg ]; then
            echo "❌ فایل rclone_mega.conf.gpg پیدا نشد"
            exit 1
          fi
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" --output ~/.config/rclone/rclone.conf rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: 🎯 دانلود پست
        env:
          POST_INDEX: ${{ steps.extract.outputs.post_number }}
        run: python .github/scripts/download_instagram_by_index.py

      - name: ☁️ آپلود به مگا
        id: mega
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          DOWNLOAD_DIR="instagram_downloads"
          if [ ! -d "$DOWNLOAD_DIR" ]; then
            echo "پوشه دانلود وجود ندارد"
            exit 1
          fi
          POST_NUM="${{ steps.extract.outputs.post_number }}"
          REMOTE_PATH="mega:Instagram_Post_$POST_NUM"
          rclone mkdir "$REMOTE_PATH" 2>/dev/null || true
          rclone copy "$DOWNLOAD_DIR" "$REMOTE_PATH" --transfers=4 --verbose

          sudo apt-get update
          sudo apt-get install -y megatools jq
          MEGA_FOLDER_PATH="/Instagram_Post_$POST_NUM"
          LINK=$(megatools export --username "$MEGA_EMAIL" --password "$MEGA_PASSWORD" "$MEGA_FOLDER_PATH" 2>/dev/null | grep -o 'https://mega.nz/[^ ]*' | head -1)
          if [ -z "$LINK" ]; then
            LINK="⚠️ لینک خودکار گرفته نشد"
          fi
          echo "link=$LINK" >> $GITHUB_OUTPUT

      - name: 💬 کامنت موفقیت
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=$(mktemp)
          echo "✅ پست شماره ${{ steps.extract.outputs.post_number }} با موفقیت به مگا آپلود شد." >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "🔗 **لینک دانلود:** ${{ steps.mega.outputs.link }}" >> "$BODY_FILE"
          gh issue comment "${{ github.event.issue.number }}" --body-file "$BODY_FILE"

      - name: ❌ کامنت خطا
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=$(mktemp)
          echo "❌ خطا در پردازش پست شماره ${{ steps.extract.outputs.post_number }}." >> "$BODY_FILE"
          echo "لطفاً لاگ اکشن را بررسی کنید." >> "$BODY_FILE"
          gh issue comment "${{ github.event.issue.number }}" --body-file "$BODY_FILE"