name: 📥 دانلود پست و آپلود در مگا (با کش)

on:
  issue_comment:
    types: [created]

jobs:
  download-and-upload:
    if: contains(github.event.comment.body, '/download')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: 📥 Checkout مخزن
        uses: actions/checkout@v4

      - name: 🔢 استخراج شماره پست
        id: extract
        run: |
          COMMENT="${{ github.event.comment.body }}"
          NUMBER=$(echo "$COMMENT" | grep -oE '/download[[:space:]]+([0-9]+)' | grep -oE '[0-9]+')
          if [ -z "$NUMBER" ]; then
            echo "No number found"
            exit 1
          fi
          echo "post_number=$NUMBER" >> $GITHUB_OUTPUT

      - name: 🐍 نصب Python و yt-dlp
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ نصب پیش‌نیازها
        run: pip install yt-dlp requests

      - name: 🔄 بازیابی کش
        id: cache
        uses: actions/cache@v4
        with:
          path: instagram_downloads
          key: instagram-post-${{ steps.extract.outputs.post_number }}

      - name: 🎯 دانلود پست (در صورت عدم کش)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          POST_INDEX: ${{ steps.extract.outputs.post_number }}
        run: python .github/scripts/download_instagram_by_index.py

      - name: 💾 ذخیره در کش (برای دفعات بعد)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: instagram_downloads
          key: instagram-post-${{ steps.extract.outputs.post_number }}

      - name: 🧰 نصب mega-cmd
        run: |
          sudo apt-get update
          wget https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb
          sudo dpkg -i megacmd-xUbuntu_22.04_amd64.deb || sudo apt-get -f install -y

      - name: ☁️ آپلود به مگا
        id: mega-upload
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          mega-login "$MEGA_EMAIL" "$MEGA_PASSWORD"
          POST_NUM="${{ steps.extract.outputs.post_number }}"
          LOCAL_DIR="instagram_downloads"
          REMOTE_DIR="/Instagram_Post_$POST_NUM"
          mega-rm "$REMOTE_DIR" --force 2>/dev/null || true
          mega-put --disable-previews "$LOCAL_DIR" "$REMOTE_DIR"
          mega-export -a "$REMOTE_DIR" > link.txt
          MEGA_LINK=$(grep -o 'https://mega.nz/[^ ]*' link.txt | head -1)
          echo "link=$MEGA_LINK" >> $GITHUB_OUTPUT
          mega-logout

      - name: 💬 کامنت موفقیت (بدون subshell پیچیده)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          POST_NUM="${{ steps.extract.outputs.post_number }}"
          MEGA_LINK="${{ steps.mega-upload.outputs.link }}"
          CACHE_HIT="${{ steps.cache.outputs.cache-hit }}"
          
          if [ "$CACHE_HIT" = "true" ]; then
            STATUS_MSG="⚡ (این فایل از روی کش بازیابی شد، دانلود جدید انجام نشد.)"
          else
            STATUS_MSG="📥 (این فایل به تازگی دانلود و سپس آپلود شده است.)"
          fi
          
          BODY="✅ پست شماره $POST_NUM با موفقیت آپلود شد.
          
🔗 **لینک دانلود از مگا:** $MEGA_LINK
          
$STATUS_MSG"
          
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"

      - name: ❌ کامنت خطا
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          gh issue comment "$ISSUE_NUMBER" --body "❌ خطا در پردازش پست شماره ${{ steps.extract.outputs.post_number }}. لطفاً بعداً تلاش کنید."
