name: 📥 دانلود پست اینستاگرام + آپلود به مگا با rclone

on:
  issue_comment:
    types: [created]

jobs:
  download-and-upload:
    if: contains(github.event.comment.body, '/download')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: 📥 Checkout مخزن
        uses: actions/checkout@v4

      - name: 🔢 استخراج شماره پست
        id: extract
        run: |
          COMMENT="${{ github.event.comment.body }}"
          NUMBER=$(echo "$COMMENT" | grep -oE '/download[[:space:]]+([0-9]+)' | grep -oE '[0-9]+')
          if [ -z "$NUMBER" ]; then
            echo "No number found"
            exit 1
          fi
          echo "post_number=$NUMBER" >> $GITHUB_OUTPUT

      - name: 🐍 نصب Python و yt-dlp
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ نصب پیش‌نیازها
        run: pip install yt-dlp requests

      - name: 🔄 بازیابی کش (بر اساس شماره پست)
        id: cache
        uses: actions/cache@v4
        with:
          path: instagram_downloads
          key: instagram-post-${{ steps.extract.outputs.post_number }}

      - name: 🎯 دانلود پست (در صورت عدم کش)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          POST_INDEX: ${{ steps.extract.outputs.post_number }}
        run: python .github/scripts/download_instagram_by_index.py

      - name: 💾 ذخیره در کش (برای دفعات بعد)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: instagram_downloads
          key: instagram-post-${{ steps.extract.outputs.post_number }}

      # ---------- آپلود با rclone (مانند روش پایدار شما) ----------
      - name: 💾 Cache rclone binary
        id: cache-rclone
        uses: actions/cache@v4
        with:
          path: /usr/bin/rclone
          key: ${{ runner.os }}-rclone-v1.74.0

      - name: 📦 Install latest rclone (if not cached)
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: 🔓 Decrypt rclone config for Mega
        run: |
          mkdir -p ~/.config/rclone
          if [ ! -f rclone_mega.conf.gpg ]; then
            echo "❌ فایل rclone_mega.conf.gpg در ریشه مخزن پیدا نشد!"
            exit 1
          fi
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" --output ~/.config/rclone/rclone.conf rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf
          echo "✅ rclone config loaded"
          rclone --config ~/.config/rclone/rclone.conf listremotes

      - name: ☁️ آپلود فایل‌ها به Mega.nz
        id: mega-upload
        run: |
          CONFIG_FILE="$HOME/.config/rclone/rclone.conf"
          REMOTE_PATH="mega:Instagram_Post_${{ steps.extract.outputs.post_number }}"
          LOCAL_DIR="instagram_downloads"
          
          # ایجاد پوشه در مگا (اختیاری)
          rclone --config "$CONFIG_FILE" mkdir "$REMOTE_PATH" 2>/dev/null || true
          
          # آپلود کل پوشه
          rclone --config "$CONFIG_FILE" copy "$LOCAL_DIR" "$REMOTE_PATH" --progress --transfers=4 --verbose
          
          # دریافت لینک عمومی (با rclone لینک گرفتن کمی متفاوت است)
          # ابتدا لینک را با rclone link می‌گیریم (برای پوشه کار نمی‌کند، باید برای هر فایل جدا)
          # برای سادگی، یک فایل متنی حاوی لینک دانلود از mage uploader? بهتر است لینک پوشه را از طریق mega-cmd بگیریم
          # اما فعلاً فرض می‌کنیم که می‌خواهید لینک فایل اول را بدهید، یا از mega-cmd برای لینک پوشه استفاده کنید.
          # راه حل: نصب mega-cmd فقط برای گرفتن لینک عمومی (بدون لاگین مجدد)
          sudo apt-get update
          wget https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb
          sudo dpkg -i megacmd-xUbuntu_22.04_amd64.deb || sudo apt-get -f install -y
          
          # لاگین با همان اطلاعات (می‌توانید از secrets استفاده کنید)
          mega-login --scripted "${{ secrets.MEGA_EMAIL }}" "${{ secrets.MEGA_PASSWORD }}"
          mega-export -a "$REMOTE_PATH" > link.txt
          MEGA_LINK=$(grep -o 'https://mega.nz/[^ ]*' link.txt | head -1)
          echo "link=$MEGA_LINK" >> $GITHUB_OUTPUT
          mega-logout

      - name: 💬 کامنت موفقیت با لینک مگا
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=$(mktemp)
          echo "✅ پست شماره ${{ steps.extract.outputs.post_number }} با موفقیت آپلود شد." >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "🔗 **لینک دانلود از مگا:** ${{ steps.mega-upload.outputs.link }}" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "⚡ (این فایل از روی کش بازیابی شد، دانلود جدید انجام نشد.)" >> "$BODY_FILE"
          else
            echo "📥 (این فایل به تازگی دانلود و سپس آپلود شده است.)" >> "$BODY_FILE"
          fi
          gh issue comment "${{ github.event.issue.number }}" --body-file "$BODY_FILE"

      - name: ❌ کامنت خطا
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "❌ خطا در پردازش پست شماره ${{ steps.extract.outputs.post_number }}. لطفاً بعداً تلاش کنید."
