name: 📥 دانلود اینستاگرام با shortcode

on:
  issue_comment:
    types: [created]

jobs:
  download:
    if: contains(github.event.comment.body, '/download')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: 📥 دریافت کد مخزن
        uses: actions/checkout@v4

      - name: 🔢 استخراج shortcode از کامنت
        id: extract
        run: |
          COMMENT="${{ github.event.comment.body }}"
          SHORTCODE=$(echo "$COMMENT" | grep -oE '/download[[:space:]]+([A-Za-z0-9_-]+)' | awk '{print $2}')
          if [ -z "$SHORTCODE" ]; then
            echo "❌ فرمت صحیح نیست. از /download <shortcode> استفاده کنید."
            exit 1
          fi
          echo "shortcode=$SHORTCODE" >> $GITHUB_OUTPUT

      - name: 🐍 نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 نصب yt-dlp و requests
        run: pip install yt-dlp requests

      # ========== کوکی (اختیاری) ==========
      - name: 🔐 رمزگشایی کوکی (در صورت وجود)
        run: |
          if [ -f cookies.txt.gpg ]; then
            gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" --decrypt cookies.txt.gpg > cookies.txt
            echo "✅ کوکی رمزگشایی شد"
          else
            echo "⚠️ بدون کوکی ادامه می‌دهیم"
            touch cookies.txt
          fi

      # ========== کش rclone ==========
      - name: 💾 کش rclone
        id: cache-rclone
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/rclone
          key: ${{ runner.os }}-rclone-v1.74.0

      - name: 📦 نصب rclone (در صورت عدم کش)
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.local/bin
          cp /usr/bin/rclone ~/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 🔗 فعال‌سازی rclone (در صورت کش)
        if: steps.cache-rclone.outputs.cache-hit == 'true'
        run: |
          chmod +x ~/.local/bin/rclone
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          rclone version

      # ========== کانفیگ rclone ==========
      - name: 🔓 رمزگشایی کانفیگ rclone
        run: |
          mkdir -p ~/.config/rclone
          if [ ! -f rclone_mega.conf.gpg ]; then
            echo "❌ فایل rclone_mega.conf.gpg یافت نشد"
            exit 1
          fi
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" --output ~/.config/rclone/rclone.conf rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes

      # ========== دانلود پست با اسکریپت جدید ==========
      - name: 🎯 دانلود پست (shortcode)
        run: |
          python .github/scripts/download_instagram_by_index.py ${{ steps.extract.outputs.shortcode }}

      # ========== آپلود به مگا ==========
      - name: ☁️ آپلود به مگا و گرفتن لینک
        id: mega
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          SHORTCODE="${{ steps.extract.outputs.shortcode }}"
          DOWNLOAD_DIR="instagram_downloads/$SHORTCODE"
          if [ ! -d "$DOWNLOAD_DIR" ]; then
            echo "❌ پوشه دانلود یافت نشد"
            exit 1
          fi
          REMOTE_PATH="mega:Instagram/${SHORTCODE}"
          rclone mkdir "$REMOTE_PATH" 2>/dev/null || true
          rclone copy "$DOWNLOAD_DIR" "$REMOTE_PATH" --transfers=4 --verbose

          sudo apt-get update
          sudo apt-get install -y megatools jq
          MEGA_FOLDER_PATH="/Instagram/${SHORTCODE}"
          LINK=$(megatools export --username "$MEGA_EMAIL" --password "$MEGA_PASSWORD" "$MEGA_FOLDER_PATH" 2>/dev/null | grep -o 'https://mega.nz/[^ ]*' | head -1)
          if [ -z "$LINK" ]; then
            LINK="⚠️ لینک خودکار گرفته نشد، فایل در مگا موجود است."
          fi
          echo "link=$LINK" >> $GITHUB_OUTPUT

      # ========== کامنت موفقیت (بدون خطای YAML) ==========
      - name: 💬 کامنت موفقیت
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=$(mktemp)
          echo "✅ پست با shortcode **${{ steps.extract.outputs.shortcode }}** با موفقیت به مگا آپلود شد." >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "🔗 **لینک دانلود:** ${{ steps.mega.outputs.link }}" >> "$BODY_FILE"
          gh issue comment "${{ github.event.issue.number }}" --body-file "$BODY_FILE"

      # ========== کامنت خطا ==========
      - name: ❌ کامنت خطا
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=$(mktemp)
          echo "❌ خطا در پردازش shortcode **${{ steps.extract.outputs.shortcode }}**." >> "$BODY_FILE"
          echo "لطفاً لاگ اکشن را بررسی کنید." >> "$BODY_FILE"
          gh issue comment "${{ github.event.issue.number }}" --body-file "$BODY_FILE"