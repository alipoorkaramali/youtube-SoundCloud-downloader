name: 📥 دانلود اینستاگرام / تیک‌تاک و آپلود به مگا

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      url_or_shortcode:
        description: 'لینک اینستاگرام / تیک‌تاک یا shortcode اینستاگرام'
        required: true
        type: string

jobs:
  download:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/download'))
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: استخراج پلتفرم و شناسه
        id: parse
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_INPUT='${{ github.event.inputs.url_or_shortcode }}'
          else
            RAW_INPUT='${{ github.event.comment.body }}'
          fi

          RAW_INPUT=$(echo "$RAW_INPUT" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          echo "📥 ورودی خام: [$RAW_INPUT]"

          PLATFORM=""
          ID=""
          FULL_URL=""

          if echo "$RAW_INPUT" | grep -qiE 'tiktok\.com|vt\.tiktok\.com|vm\.tiktok\.com'; then
            PLATFORM="tiktok"

            FULL_URL=$(echo "$RAW_INPUT" | grep -oE 'https?://[^[:space:]"'\''<>]+' | grep -i tiktok | head -1)

            if [ -z "$FULL_URL" ] && echo "$RAW_INPUT" | grep -qE '^https?://'; then
              FULL_URL="$RAW_INPUT"
            fi

            FULL_URL=$(echo "$FULL_URL" | sed -E 's#/(true|false)/?$##')
            FULL_URL=$(echo "$FULL_URL" | sed -E 's#[?&].*$##')

            SHORT=$(echo "$FULL_URL" | grep -oE 'https?://(vt|vm)\.tiktok\.com/[A-Za-z0-9_-]+' | head -1 || true)
            if [ -n "$SHORT" ]; then
              FULL_URL="${SHORT}/"
            fi

            ID=$(echo "$FULL_URL" | grep -oE '/video/[0-9]+' | head -1 | sed 's|/video/||' || true)
            if [ -z "$ID" ]; then
              ID=$(echo "$FULL_URL" | grep -oE '[0-9]{15,}' | head -1 || true)
            fi
            if [ -z "$ID" ]; then
              ID=$(echo "$FULL_URL" | grep -oE '(vt|vm)\.tiktok\.com/[A-Za-z0-9_-]+' | head -1 | sed 's|.*/||' || true)
            fi
            if [ -z "$ID" ]; then
              ID="tiktok_$(date +%s)"
            fi

          elif echo "$RAW_INPUT" | grep -qiE 'instagram\.com'; then
            PLATFORM="instagram"

            FULL_URL=$(echo "$RAW_INPUT" | grep -oE 'https?://[^[:space:]"'\''<>]+' | grep -i instagram | head -1)
            if [ -z "$FULL_URL" ] && echo "$RAW_INPUT" | grep -qE '^https?://'; then
              FULL_URL="$RAW_INPUT"
            fi

            FULL_URL=$(echo "$FULL_URL" | sed -E 's#[?&].*$##')
            FULL_URL=$(echo "$FULL_URL" | sed -E 's#/+$##')
            FULL_URL="${FULL_URL}/"

            ID=$(echo "$FULL_URL" | grep -oE '/(p|reel|tv)/[A-Za-z0-9_-]+' | head -1 | awk -F'/' '{print $NF}')
            if [ -z "$ID" ]; then
              ID=$(echo "$RAW_INPUT" | grep -oE '/download[[:space:]]+([A-Za-z0-9_-]+)' | awk '{print $2}')
            fi

          else
            PLATFORM="instagram"
            ID=$(echo "$RAW_INPUT" | grep -oE '/download[[:space:]]+([A-Za-z0-9_-]+)' | awk '{print $2}')
            if [ -z "$ID" ]; then
              ID=$(echo "$RAW_INPUT" | grep -oE '[A-Za-z0-9_-]{5,}' | grep -viE '^(true|false|null|undefined|download|https?)$' | head -1 || true)
            fi
            if [ -n "$ID" ]; then
              FULL_URL="https://www.instagram.com/p/${ID}/"
            fi
          fi

          if echo "$ID" | grep -qiE '^(true|false|null|undefined|truetrue)$'; then
            echo "❌ شناسه نامعتبر استخراج شد: [$ID]"
            exit 1
          fi

          if [ -z "$PLATFORM" ] || [ -z "$ID" ] || [ -z "$FULL_URL" ]; then
            echo "❌ نتوانست پلتفرم/لینک را استخراج کند"
            exit 1
          fi

          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "full_url=$FULL_URL" >> $GITHUB_OUTPUT

          echo "✅ پلتفرم: $PLATFORM"
          echo "✅ شناسه: $ID"
          echo "✅ URL: $FULL_URL"

      - name: 🔐 رمزگشایی کوکی اینستاگرام
        if: steps.parse.outputs.platform == 'instagram'
        run: |
          if [ ! -f config/INSTAGRAM_COOKIES.gpg ]; then
            echo "⚠️ کوکی موجود نیست"
            exit 0
          fi
          gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" --decrypt config/INSTAGRAM_COOKIES.gpg > cookies.txt || true
          if [ -s cookies.txt ]; then
            echo "✅ کوکی رمزگشایی شد"
            echo "INSTAGRAM_COOKIES_PATH=$(pwd)/cookies.txt" >> $GITHUB_ENV
          fi

      - name: نصب ابزارها
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip jq
          pip3 install --upgrade "yt-dlp[default,curl-cffi]" gallery-dl instaloader
          echo "--- versions ---"
          yt-dlp --version
          gallery-dl --version || true
          instaloader --version || true

      - name: دانلود محتوا
        id: download
        env:
          PLATFORM: ${{ steps.parse.outputs.platform }}
          ITEM_ID: ${{ steps.parse.outputs.id }}
          FULL_URL: ${{ steps.parse.outputs.full_url }}
        run: |
          set -e
          echo "========================================"
          echo "پلتفرم : $PLATFORM"
          echo "شناسه  : $ITEM_ID"
          echo "URL    : $FULL_URL"
          echo "========================================"

          if [ -z "$FULL_URL" ]; then
            echo "❌ FULL_URL خالی است!"
            exit 1
          fi

          DOWNLOAD_DIR="${PLATFORM}_downloads/${ITEM_ID}"
          mkdir -p "$DOWNLOAD_DIR"
          FULL_URL=$(echo "$FULL_URL" | sed -E 's#[?&].*$##')

          if [ "$PLATFORM" = "instagram" ]; then
            EXIT_CODE=1

            echo "▶️ [IG] تلاش ۱: بدون کوکی + impersonate chrome..."
            set +e
            yt-dlp --no-playlist --retries 5 --fragment-retries 5 --merge-output-format mp4 --impersonate chrome -f "b" -o "${DOWNLOAD_DIR}/%(uploader)s - %(title)s [%(id)s].%(ext)s" "$FULL_URL" 2>&1 | tee /tmp/ytdlp.log
            EXIT_CODE=${PIPESTATUS[0]}
            set -e

            if [ "$EXIT_CODE" -ne 0 ] && [ -n "$INSTAGRAM_COOKIES_PATH" ] && [ -f "$INSTAGRAM_COOKIES_PATH" ]; then
              echo "⚠️ [IG] تلاش ۲: با کوکی + impersonate..."
              find "$DOWNLOAD_DIR" -type f ! -name 'post_info.json' -delete 2>/dev/null || true
              set +e
              yt-dlp --no-playlist --retries 5 --fragment-retries 5 --merge-output-format mp4 --impersonate chrome --cookies "$INSTAGRAM_COOKIES_PATH" -f "b" -o "${DOWNLOAD_DIR}/%(uploader)s - %(title)s [%(id)s].%(ext)s" "$FULL_URL" 2>&1 | tee /tmp/ytdlp.log
              EXIT_CODE=${PIPESTATUS[0]}
              set -e
            fi

            if [ "$EXIT_CODE" -ne 0 ] && [ -n "$INSTAGRAM_COOKIES_PATH" ] && [ -f "$INSTAGRAM_COOKIES_PATH" ]; then
              echo "⚠️ [IG] تلاش ۳: فقط کوکی..."
              find "$DOWNLOAD_DIR" -type f ! -name 'post_info.json' -delete 2>/dev/null || true
              set +e
              yt-dlp --no-playlist --retries 5 --fragment-retries 5 --merge-output-format mp4 --cookies "$INSTAGRAM_COOKIES_PATH" -f "b" -o "${DOWNLOAD_DIR}/%(uploader)s - %(title)s [%(id)s].%(ext)s" "$FULL_URL" 2>&1 | tee /tmp/ytdlp.log
              EXIT_CODE=${PIPESTATUS[0]}
              set -e
            fi
          else
            echo "▶️ [TT] شروع دانلود تیک‌تاک..."
            set +e
            yt-dlp --no-playlist --retries 10 --fragment-retries 10 --merge-output-format mp4 -f "b" -o "${DOWNLOAD_DIR}/%(uploader)s - %(title)s [%(id)s].%(ext)s" "$FULL_URL" 2>&1 | tee /tmp/ytdlp.log
            EXIT_CODE=${PIPESTATUS[0]}
            set -e
          fi

          if [ $EXIT_CODE -ne 0 ]; then
            echo "⚠️ yt-dlp با کد $EXIT_CODE شکست خورد"
            tail -40 /tmp/ytdlp.log || true
          fi

          FILE_COUNT=$(find "$DOWNLOAD_DIR" -type f \( -name '*.mp4' -o -name '*.webm' -o -name '*.mkv' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.webp' -o -name '*.mp3' -o -name '*.m4a' \) 2>/dev/null | wc -l)

          if [ "$PLATFORM" = "instagram" ] && [ "$FILE_COUNT" -eq 0 ]; then
            echo "🔄 [IG-FALLBACK] شروع فالبک gallery-dl / instaloader..."
            find "$DOWNLOAD_DIR" -type f ! -name 'post_info.json' -delete 2>/dev/null || true

            echo "▶️ [IG-FALLBACK] gallery-dl بدون کوکی..."
            set +e
            gallery-dl --dest "$DOWNLOAD_DIR" "$FULL_URL" 2>&1 | tee /tmp/gallerydl.log
            set -e
            find "$DOWNLOAD_DIR" -type f \( -name '*.mp4' -o -name '*.webm' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.webp' \) -exec mv -n {} "$DOWNLOAD_DIR"/ \; 2>/dev/null || true
            FILE_COUNT=$(find "$DOWNLOAD_DIR" -maxdepth 1 -type f \( -name '*.mp4' -o -name '*.webm' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.webp' \) 2>/dev/null | wc -l)

            if [ "$FILE_COUNT" -eq 0 ] && [ -n "$INSTAGRAM_COOKIES_PATH" ] && [ -f "$INSTAGRAM_COOKIES_PATH" ]; then
              echo "⚠️ gallery-dl با کوکی..."
              find "$DOWNLOAD_DIR" -type f ! -name 'post_info.json' -delete 2>/dev/null || true
              set +e
              gallery-dl --dest "$DOWNLOAD_DIR" --cookies "$INSTAGRAM_COOKIES_PATH" "$FULL_URL" 2>&1 | tee /tmp/gallerydl.log
              set -e
              find "$DOWNLOAD_DIR" -type f \( -name '*.mp4' -o -name '*.webm' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.webp' \) -exec mv -n {} "$DOWNLOAD_DIR"/ \; 2>/dev/null || true
              FILE_COUNT=$(find "$DOWNLOAD_DIR" -maxdepth 1 -type f \( -name '*.mp4' -o -name '*.webm' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.webp' \) 2>/dev/null | wc -l)
            fi

            if [ "$FILE_COUNT" -eq 0 ]; then
              echo "⚠️ instaloader..."
              find "$DOWNLOAD_DIR" -type f ! -name 'post_info.json' -delete 2>/dev/null || true
              set +e
              instaloader --dirname-pattern="$DOWNLOAD_DIR" --filename-pattern="{shortcode}" --no-captions --no-metadata-json --no-compress-json -- -"$ITEM_ID" 2>&1 | tee /tmp/instaloader.log
              set -e
              find "$DOWNLOAD_DIR" -type f \( -name '*.mp4' -o -name '*.webm' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.webp' \) -exec mv -n {} "$DOWNLOAD_DIR"/ \; 2>/dev/null || true
              FILE_COUNT=$(find "$DOWNLOAD_DIR" -maxdepth 1 -type f \( -name '*.mp4' -o -name '*.webm' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.webp' \) 2>/dev/null | wc -l)
            fi
          fi

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ هیچ فایلی دانلود نشد (yt-dlp + fallback)"
            ls -laR "$DOWNLOAD_DIR" || true
            tail -30 /tmp/gallerydl.log 2>/dev/null || true
            tail -30 /tmp/instaloader.log 2>/dev/null || true
            exit 1
          fi

          echo "✅ دانلود موفق — تعداد فایل: $FILE_COUNT"
          ls -lh "$DOWNLOAD_DIR"

          USERNAME=$(yt-dlp --print "%(uploader)s" --no-download "$FULL_URL" 2>/dev/null || echo "unknown")
          [ -z "$USERNAME" ] && USERNAME="unknown"

          REAL_ID=$(grep -oE '\[TikTok\] [0-9]{15,}' /tmp/ytdlp.log 2>/dev/null | head -1 | awk '{print $2}' || true)
          if [ -n "$REAL_ID" ] && [ "$REAL_ID" != "$ITEM_ID" ]; then
            echo "🔄 به‌روزرسانی شناسه واقعی: $REAL_ID"
            NEW_DIR="${PLATFORM}_downloads/${REAL_ID}"
            if [ "$DOWNLOAD_DIR" != "$NEW_DIR" ]; then
              mv "$DOWNLOAD_DIR" "$NEW_DIR" || true
              DOWNLOAD_DIR="$NEW_DIR"
              ITEM_ID="$REAL_ID"
              echo "id=$REAL_ID" >> $GITHUB_OUTPUT
            fi
          fi

          cat > "$DOWNLOAD_DIR/post_info.json" << JSON
          {
            "id": "$ITEM_ID",
            "username": "$USERNAME",
            "platform": "$PLATFORM"
          }
          JSON

          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "final_id=$ITEM_ID" >> $GITHUB_OUTPUT
          echo "👤 Username: $USERNAME"
          echo "🆔 Final ID: $ITEM_ID"

      - name: Cache rclone
        if: success()
        uses: actions/cache@v4
        id: cache-rclone
        with:
          path: ~/.local/bin/rclone
          key: rclone-${{ runner.os }}

      - name: Install rclone (if not cached)
        if: success() && steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          mkdir -p ~/.local/bin
          cp rclone-*-linux-amd64/rclone ~/.local/bin/
          chmod +x ~/.local/bin/rclone
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Enable rclone (cached)
        if: success() && steps.cache-rclone.outputs.cache-hit == 'true'
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Decrypt rclone config
        if: success()
        run: |
          mkdir -p ~/.config/rclone
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" \
              --output ~/.config/rclone/rclone.conf config/rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Upload to Mega
        if: success()
        id: upload
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          PLATFORM="${{ steps.parse.outputs.platform }}"
          ID="${{ steps.download.outputs.final_id }}"
          [ -z "$ID" ] && ID="${{ steps.parse.outputs.id }}"
          USERNAME="${{ steps.download.outputs.username }}"
          [ -z "$USERNAME" ] && USERNAME="unknown"

          if [ "$PLATFORM" = "tiktok" ]; then
            MEGA_FOLDER="TikTok"
          else
            MEGA_FOLDER="Instagram"
          fi

          echo "mega_folder=$MEGA_FOLDER" >> $GITHUB_OUTPUT
          REMOTE="mega:${MEGA_FOLDER}/${USERNAME}/${ID}"
          echo "📤 آپلود به: $REMOTE"

          rclone mkdir "$REMOTE" 2>/dev/null || true
          rclone copy "${PLATFORM}_downloads/${ID}" "$REMOTE" --transfers=4

          sudo apt-get update -qq && sudo apt-get install -y -qq megatools || true
          LINK=$(megatools export --username "$MEGA_EMAIL" --password "$MEGA_PASSWORD" "/${MEGA_FOLDER}/${USERNAME}/${ID}" 2>/dev/null | grep -o 'https://mega.nz/[^ ]*' | head -1 || true)
          echo "link=$LINK" >> $GITHUB_OUTPUT

      - name: Comment success
        if: success() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLATFORM="${{ steps.parse.outputs.platform }}"
          gh issue comment "${{ github.event.issue.number }}" --body "✅ **${PLATFORM^}** با موفقیت دانلود و به مگا آپلود شد.\n\n- شناسه: \`${{ steps.download.outputs.final_id || steps.parse.outputs.id }}\`\n- کاربر: \`${{ steps.download.outputs.username }}\`"

      - name: Comment error
        if: failure() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "❌ خطا در دانلود \`${{ steps.parse.outputs.platform }}\` (شناسه: ${{ steps.parse.outputs.id }})."
