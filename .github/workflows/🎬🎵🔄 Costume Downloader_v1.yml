name: 🎬🔄🎵 Costume Downloader + Mega.nz (with ZIP split & Smart Cookie Failover)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '🌐 پلتفرم'
        required: true
        default: 'youtube'
        type: choice
        options:
          - youtube
          - soundcloud
      url:
        description: '🔗 لینک دانلود'
        required: true
      type:
        description: 'نوع دانلود'
        required: true
        default: 'audio'
        type: choice
        options:
          - audio
          - video
      quality:
        description: '🎬 کیفیت ویدیو (فقط برای حالت ویدیو)'
        required: false
        default: 'best'
        type: choice
        options:
          - '144p'
          - '240p'
          - '360p'
          - '480p'
          - '720p'
          - '1080p'
          - 'best'
      folder:
        description: '📁 پوشه موقت'
        required: false
        default: 'downloads'
      mega_folder:
        description: '📂 پوشه در Mega.nz'
        required: false
        default: 'YoutubeDownloads'
      split_choice:
        description: 'تقسیم فایل به چند قسمت (ZIP volume)؟'
        required: true
        default: 'single'
        type: choice
        options:
          - single
          - split
      split_size:
        description: 'اندازه هر قسمت (مثال: 100M, 500M, 1G)'
        required: false
        default: '100M'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 🔍 مرحله تست API عمومی (فقط برای اطمینان از فعال بودن آن)
      - name: 🔍 Test Public API availability
        env:
          COOKIE_DECRYPT_KEY: ${{ secrets.COOKIE_DECRYPT_KEY }}
        run: |
          echo "🔄 تست API عمومی (cookies-service.onrender.com) ..."
          if python3 .github/scripts/cookie_manager.py test_public; then
            echo "PUBLIC_API_OK=true" >> $GITHUB_ENV
            echo "✅ API عمومی در دسترس است."
          else
            echo "PUBLIC_API_OK=false" >> $GITHUB_ENV
            echo "⚠️ هشدار: API عمومی پاسخ نمی‌دهد. فقط از کوکی‌های شخصی استفاده خواهد شد."
          fi

      - name: ⚙️ Setup yt-dlp + ffmpeg
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          aria2: false
          ffmpeg: true
          nightly: true

      - name: 📦 Install PO Token Plugin
        run: |
          python3 -m pip install --upgrade bgutil-ytdlp-pot-provider
          echo "✅ PO Token Plugin installed"

      - name: 💾 Cache rclone binary
        id: cache-rclone
        uses: actions/cache@v4
        with:
          path: ~/bin/rclone
          key: ${{ runner.os }}-rclone-v1.74.1

      - name: 📦 Install latest rclone (if not cached)
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/bin
          cp /usr/bin/rclone ~/bin/rclone
          chmod +x ~/bin/rclone
          ~/bin/rclone version

      - name: 🔓 Decrypt rclone config
        run: |
          mkdir -p ~/.config/rclone
          if [ ! -f rclone_mega.conf.gpg ]; then
            echo "❌ فایل rclone_mega.conf.gpg پیدا نشد!"
            exit 1
          fi
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.RCLONE_PASSPHRASE }}" \
              --output ~/.config/rclone/rclone.conf rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf
          echo "✅ rclone config loaded"

      - name: 🎯 Smart Download with Retry (Personal Cookies + Public Fallback)
        id: download
        env:
          COOKIE_DECRYPT_KEY: ${{ secrets.COOKIE_DECRYPT_KEY }}
        run: |
          chmod +x .github/scripts/download_with_retry.sh
          .github/scripts/download_with_retry.sh \
            "${{ github.event.inputs.folder }}" \
            "${{ github.event.inputs.url }}" \
            "${{ github.event.inputs.platform }}" \
            "${{ github.event.inputs.type }}" \
            "${{ github.event.inputs.quality }}" \
            "${{ github.event.inputs.split_choice }}" \
            "${{ github.event.inputs.split_size }}"
          echo "✅ Download completed successfully"

      - name: ☁️ Upload to Mega.nz
        run: |
          CONFIG_FILE="$HOME/.config/rclone/rclone.conf"
          REMOTE_PATH="mega:${{ github.event.inputs.mega_folder }}"
          
          echo "📁 محتویات پوشه '${{ github.event.inputs.folder }}':"
          ls -la "${{ github.event.inputs.folder }}"
          
          echo "🟢 بررسی rclone:"
          ~/bin/rclone version || { echo "⚠️ rclone قابل اجرا نیست"; exit 1; }
          
          echo "🔄 تست اتصال به Mega:"
          ~/bin/rclone --config "$CONFIG_FILE" lsd mega: || { echo "❌ اتصال به مگا برقرار نیست"; exit 1; }
          
          echo "📂 ایجاد پوشه در مگا: $REMOTE_PATH"
          ~/bin/rclone --config "$CONFIG_FILE" mkdir "$REMOTE_PATH" 2>&1 || true
          
          echo "☁️ شروع آپلود..."
          ~/bin/rclone --config "$CONFIG_FILE" copy "${{ github.event.inputs.folder }}" "$REMOTE_PATH" \
            --progress --transfers=4 -vv
          
          echo "🔍 لیست نهایی فایل‌ها در مگا:"
          ~/bin/rclone --config "$CONFIG_FILE" ls "$REMOTE_PATH"
