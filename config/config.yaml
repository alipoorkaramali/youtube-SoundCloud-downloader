# ═══════════════════ پیکربندی اصلی ═══════════════════

# نام کانال تلگرام بدون @ (مثال: bbcpersian)
channel: "bbcpersian"

# تعداد پست‌هایی که از کانال واکشی می‌شود
limit: 15

# حداکثر حجم مجاز برای دانلود هر فایل رسانه (مگابایت)
max_media_mb: 80

# پوشهٔ اصلی خروجی (همهٔ فایل‌های دانلودشده و گزارش‌ها اینجا ذخیره می‌شوند)
output_dir: "Download"

# پوشهٔ پروفایل دائمی مرورگر (همان که با save_session.py ساخته شد)
profile_dir: "config/browser_profile"

# فاصلهٔ زمانی (ثانیه) بین بارگذاری هر پست (جلوگیری از فشار روی تلگرام)
delay_between_posts: 1.5

# ═══════════════════ پارامترهای جدید (اختیاری) ═══════════════════

# نام نمایشی کانال (برای جستجوی دقیق‌تر)
channel_name: ""

# ادامه از آخرین پست (اگر true باشد، start_link نادیده گرفته می‌شود)
resume: false

# لینک مستقیم به یک پست (شروع از آن پست)
start_link: ""

# جهت اسکرول: up = پست‌های قدیمی‌تر، down = پست‌های جدیدتر
scroll_direction: "up"

# ذخیره اسکرین‌شات‌ها
save_screenshots: false

# حداکثر زمان اجرا به ثانیه (۰ = استفاده از پیش‌فرض کد)
timeout_seconds: 0

# آستانه سکوت برای اتمام دانلود (ثانیه)
download_quiet_seconds: 20
