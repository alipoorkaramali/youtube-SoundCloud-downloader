name: Debug GPG File

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📂 List config directory
        run: ls -la config/

      - name: 🔍 Check file type and first bytes
        run: |
          file config/rclone_mega.conf.gpg
          echo "First 32 bytes in hex:"
          od -An -N 32 -x config/rclone_mega.conf.gpg || echo "Failed to read"
          echo "First 10 bytes in ASCII:"
          head -c 10 config/rclone_mega.conf.gpg | cat -A

      - name: 🧪 Try to list GPG packets (no decryption)
        run: |
          gpg --batch --list-packets config/rclone_mega.conf.gpg 2>&1 || true

      - name: 📏 File size
        run: stat config/rclone_mega.conf.gpg
